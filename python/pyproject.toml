[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstack"
version = "0.1.0"
description = "Production-grade full-stack RAG system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # >=0.133 is a SECURITY floor, not a feature one. Before 0.133 the
    # /openapi.json route folded the request's root_path into APP-level state
    # (`self.servers.insert(0, {"url": root_path})`) on a schema it also caches.
    # api/root_path.py makes root_path reachable from a request header, so on an
    # older FastAPI one unauthenticated `curl -H 'X-Forwarded-Prefix: /evil'
    # .../openapi.json` would pin `{"url": "/evil"}` into the schema served to
    # every later client, and a fresh prefix per request would grow that list
    # without bound. 0.133+ copies the schema per request (`schema =
    # dict(schema)`), which is what keeps the header a per-request fact.
    "fastapi>=0.133",
    "python-multipart>=0.0.9",  # required by POST /v1/ingest/upload (Form/File)
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # RSA signature verification for the identity layer (ragstack/identity/):
    # BV-BRC signed tokens (PKCS#1 v1.5 / SHA-1) and OIDC ID tokens (RS256).
    # Non-optional even though IDENTITY_PROVIDER defaults to `none`, because
    # api/security.py imports the layer unconditionally — an auth path that can
    # be switched off by a missing wheel is worse than a required dependency.
    "cryptography>=42",
]

[project.optional-dependencies]
vector = [
    "qdrant-client>=1.9",
]
pdf = [
    "pymupdf>=1.24",
]
postgres = [
    "asyncpg>=0.29",
]
text = [
    # [async] pulls aiohttp, required by AsyncElasticsearch.
    #
    # UPPER BOUND IS LOAD-BEARING — do not remove it to "get the latest".
    # The Elasticsearch client's major version must match the server's major
    # version: a 9.x client stamps every request with an
    # `Accept: application/vnd.elasticsearch+json; compatible-with=9` header,
    # which an ES 8.x server rejects outright with HTTP 400
    # `media_type_header_exception`. That is a *runtime* failure on the first
    # ES call, not an install-time one, so an unbounded `>=8.13` breaks silently
    # on any fresh install or resolver refresh.
    #
    # Deployed servers are ES 8.x (deploy/docker-compose.infra.yml and the CI
    # integration job both run elasticsearch:8.13.4; prod runs 8.13.4/8.19.3),
    # and the prod env `/rag/envs/ragstack` has client 8.19.3. This was hit for
    # real building the CWL worker image (#225), which resolved to 9.4.1.
    #
    # Raise the bound to `<10` ONLY together with upgrading the ES servers to 9.x
    # (compose infra, the CI service image, and the deployed clusters).
    "elasticsearch[async]>=8.13,<9",
]
graph = [
    "neo4j>=5.20",
    "networkx>=3.3",
    "spacy>=3.7",
]
embeddings = [
    "openai>=1.30",
    # Upper bound: the crossencoder sidecar's fp16 path calls the private attr
    # `_model.model.half()`, whose internal layout is not part of the public API.
    # sentence-transformers 4.x may relocate it → AttributeError at boot. See #53.
    "sentence-transformers>=3.0,<4",
]
chunking = [
    # NLTK Punkt sentence tokenizer, used by the sentence/semantic chunkers for
    # high-quality sentence splitting (a regex fallback is used when absent).
    # Vendor or download the punkt model: `python -m nltk.downloader punkt`.
    "nltk>=3.8",
]
tokenization = [
    # transformers.AutoTokenizer is the default token counter (HFTokenCounter):
    # it loads the *embedding model's* tokenizer for an exact token count so
    # chunks can be sized/capped to the model context (e.g. SFR-Mistral 4096).
    # Lazy-imported; the endpoint (/tokenize) and char-ratio backends need no
    # extra deps, so this is opt-in. torch is NOT required for tokenizing.
    "transformers>=4.40",
]
queue = [
    "celery[redis]>=5.4",
    "redis>=5.0",
]
mcp = [
    # Official Model Context Protocol Python SDK, for `python -m ragstack.mcp`.
    # The server uses the 2.x `mcp.server.MCPServer` API (FastMCP's successor).
    "mcp>=2.0",
]
observability = [
    "structlog>=24.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    # Conformance suite validates responses against contracts/schemas/.
    # Floor matches conformance/pyproject.toml so dev installs don't diverge.
    "jsonschema>=4.22",
    # The CWL contract tests (tests/ingestion/test_pdf_ingest_scatter_cwl.py,
    # tests/integration/test_archive_cwl.py) parse the workflows as YAML.
    "pyyaml>=6",
]
all = [
    "ragstack[vector,pdf,postgres,text,graph,embeddings,chunking,tokenization,queue,observability]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragstack*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "perf: performance budget tests (excluded by default)",
    "integration: needs a live service or an external runner (tests/integration; selected by path in CI)",
]
addopts = "-m 'not perf'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI's dependency-injection idiom is `param = Depends(...)` in the
# signature default — required by the framework and used throughout the routers.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
