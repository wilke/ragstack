name: Publish architecture deep-dive to Pages

# Renders docs/ARCHITECTURE-DEEP-DIVE.md → a self-contained HTML page and
# deploys it as the GitHub Pages site (index). Enable once under
# Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/ARCHITECTURE-DEEP-DIVE.md
      - docs/build_arch_html.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python docs/build_arch_html.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/architecture-deep-dive.html _site/index.html
          cp docs/architecture-deep-dive.html _site/architecture-deep-dive.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
