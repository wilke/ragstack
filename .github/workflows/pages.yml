name: Publish docs to Pages

# Renders selected repo docs → a small self-contained HTML site (index + one
# page per doc) and deploys it to GitHub Pages. The configure-pages step below
# enables Pages on first run (enablement: true), so no manual repo setting is
# needed — just merge to main.
on:
  push:
    branches: [main]
    # Any markdown under docs/ — enumerating the published subset here meant a
    # newly-published doc silently never triggered a rebuild. Rebuilding on an
    # unpublished doc is cheap; not rebuilding on a published one is a stale site.
    paths:
      - "docs/**/*.md"
      - docs/build_docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Enables GitHub Pages (Actions source) if it isn't already — this is what
      # was missing, and why the deploy 404'd.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install markdown
      # --site assembles exactly the pages build_docs.py generates. Do not
      # reintroduce a hardcoded copy list here: the previous one drifted from
      # PAGES and silently dropped three pages from the deployed site.
      - run: python docs/build_docs.py --site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
