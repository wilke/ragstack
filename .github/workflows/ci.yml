name: CI

# Lint + type-check + test on every PR and push to main. Catches the class of
# slips that have reached main without CI (a unit-test AttributeError, a ruff
# UP017, an untypechecked frontend change).
#
# Jobs: python (offline: unit/ingestion/api/registry — in-memory doubles),
# frontend (typecheck/test/build), integration (tests/integration against ES +
# Postgres service containers). Still out of scope: tests/eval and the conformance
# suite need the embedding/crossencoder sidecars (model downloads) + a full stack.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # pyproject: requires-python >= 3.12
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install (editable, all extras + dev)
        run: pip install -e ".[all,dev]"   # matches `make install-python`
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy ragstack/
      - name: pytest (offline suites)
        # unit + ingestion + api + the registry test run without infra: the api
        # tests use in-memory doubles (tests/api/conftest.py). integration/eval
        # need live backends and run in the integration job / not at all.
        run: pytest tests/unit tests/ingestion tests/api tests/test_document_registry.py -q

  frontend:
    name: frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: xss guard
        run: npm run guard:xss
      - name: test
        run: npm test
      - name: build
        run: npm run build

  integration:
    name: integration (ES + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ragstack
          POSTGRES_PASSWORD: ragstack
          POSTGRES_DB: ragstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragstack"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install (editable, all extras + dev)
        run: pip install -e ".[all,dev]"
      - name: Wait for Elasticsearch
        # The ES image ships no curl for a container health-cmd; poll from the
        # runner instead until the cluster answers.
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:9200/_cluster/health && break
            echo "waiting for ES ($i)..."; sleep 5
          done
      - name: pytest (integration)
        env:
          TEST_ES_URL: http://localhost:9200
          TEST_PG_DSN: postgresql://ragstack:ragstack@localhost:5432/ragstack
        run: pytest tests/integration -q
