# ops/ansible/tenant-host.yml — migration / second-site target (tag tenant-host).
# = coconut-host + ragstack-ctl minus adoption, plus apptainer + SIF pulls,
# conda env presence and the ES sysctl (which lives in coconut-host).
# Reuses the roles with variables instead of duplicating tasks. Point it at
# another inventory: -i inventory/<site>.yml and override group_vars as needed.
---
- name: Resolve shared facts (always)
  hosts: all
  gather_facts: true
  become: false
  tags: [always]
  tasks:
    - name: Look up the ctl account
      ansible.builtin.getent:
        database: passwd
        key: "{{ ctl_user }}"

    - name: Set ctl_uid from getent
      ansible.builtin.set_fact:
        ctl_uid: "{{ ansible_facts.getent_passwd[ctl_user][1] }}"

- name: Root host preparation for a tenant host
  hosts: all
  become: true
  tags: [tenant-host, root]
  roles:
    - role: coconut-host
      vars:
        # A fresh site has no interactive nginx to switch from; the proxy
        # unit is only installed when the coconut-proxy tree was deployed.
        proxy_switch_now: false
        proxy_unit_install: "{{ tenant_host_install_proxy | default(false) }}"

- name: Tenant-host runtime checks (apptainer, images, conda env)
  hosts: all
  become: false
  tags: [tenant-host]
  roles:
    - role: tenant-host

- name: ragstack-ctl prerequisites on a tenant host
  hosts: all
  become: false
  tags: [tenant-host, ctl]
  vars:
    # Unprivileged become (wilke -> svcbvbrc) without setfacl: keep Ansible's
    # temp files inside a ragops-only directory (created by the first task)
    # and allow the world-readable fallback only there. See README.
    ansible_remote_tmp: "{{ ctl_ansible_tmp }}"
    ansible_shell_allow_world_readable_temp: true
  pre_tasks:
    - name: Group {{ ragops_group }} lookup for the temp dir
      ansible.builtin.getent:
        database: group
        key: "{{ ragops_group }}"
        fail_key: false
      tags: [always]
    - name: Confine Ansible temp files to {{ ctl_ansible_tmp }} (2770 {{ operator_user }}:{{ ragops_group }})
      ansible.builtin.file:
        path: "{{ ctl_ansible_tmp }}"
        state: directory
        mode: "2770"
        group: "{{ ragops_group if ansible_facts.getent_group[ragops_group] is not none else omit }}"
      vars:
        ansible_shell_allow_world_readable_temp: false
      check_mode: false   # the dir must exist for the preview's become tasks too
      tags: [always]
  roles:
    - role: ragstack-ctl
      vars:
        # No tenants to adopt on a fresh host: the group pass skips paths
        # that do not exist, and the bare mirror comes from ctl_mirror_src.
        ctl_group_pass_require_paths: false
