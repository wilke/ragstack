# ops/ansible/ansible.cfg — picked up only when ansible-playbook is run from
# this directory (ansible ignores a config in a world-writable cwd).
[defaults]
inventory = inventory/coconut.yml
roles_path = roles
interpreter_python = auto_silent
# Pipelining sends modules over stdin: no temp files for command/stat/getent
# tasks that become svcbvbrc (the local connection supports it).
pipelining = True
retry_files_enabled = False
# `stdout_callback = yaml` needs the community.general collection; the
# builtin default callback can render results as YAML on its own (2.13+),
# so use that and keep the collection dependency at zero.
callback_result_format = yaml
display_skipped_hosts = True
host_key_checking = False
# vault.yml (gitignored) is passed explicitly: -e @vault.yml --ask-vault-pass

[privilege_escalation]
become_method = sudo
# `become` is opted into per play/task, never globally.
become = False
