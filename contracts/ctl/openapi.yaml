            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}/steps/{n}/log:
    get:
      operationId: ctlJobStepLog
      summary: Tail of one step's log
      description: OPERATOR. Redacted like tenant logs; same `lines` bound.
      tags: [Jobs]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/StepN"
        - $ref: "#/components/parameters/Lines"
      responses:
        "200":
          description: Redacted step log tail
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepLogResponse" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}/secrets:
    get:
      operationId: ctlJobSecrets
      summary: Collect minted secrets — once
      description: >-
        OPERATOR, and NOT over a session: the caller must present the ctl key
        itself. The only response in this API that carries a secret value. The
        first successful read destroys the envelope; every later read is 410.
        The envelope is bound to the principal and op that minted it (another
        operator's key is 403), expires 15 minutes after the mint, and is
        never in the job, the audit log or a step log. Sent with
        `Cache-Control: no-store`.
      tags: [Jobs]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The secrets, delivered once
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretsResponse" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Not an operator, called over a session, or an operator other than
            the one who minted the envelope.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown job, or a job that minted nothing.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: >-
            Already delivered, or expired. Code `not_found`; `detail` says
            which and when. The remedy is a new, audited mint.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}/resume:
    post:
      operationId: ctlJobResume
      summary: Resume an interrupted job
      description: >-
        OPERATOR, re-authorized. Only a job in `interrupted` may be resumed;
        the daemon reconciles every recorded `external_ids` (does the
        snapshot exist? is the unit active?) before re-running from the last
        checkpoint. Any other state is 409 `refused`. Same envelope as an
        operation; `args` is `{}`.
      tags: [Jobs, Operations]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpRequest" }
      responses:
        "200": { $ref: "#/components/responses/PlanResponse" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "428": { $ref: "#/components/responses/ConfirmRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}/continue:
    post:
      operationId: ctlJobContinue
      summary: Continue a job parked at a cutover
      description: >-
        OPERATOR, re-authorized. For a job in `awaiting_cutover` (handover,
        migrate-local): `args.phase` is `commit` or `rollback`. Commit is the
        explicit step that writes the released state (`owner`, paths, ports);
        rollback restores the recorded gateway generation and restarts only
        that tenant from its rollback descriptor. Any other state is 409
        `refused`. `requires_confirm` is true for commit.
      tags: [Jobs, Operations]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpRequest" }
      responses:
        "200": { $ref: "#/components/responses/PlanResponse" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "428": { $ref: "#/components/responses/ConfirmRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}/cancel:
    post:
      operationId: ctlJobCancel
      summary: Cancel a queued, running or parked job
      description: >-
        OPERATOR, re-authorized. `queued` → `cancelled` immediately. `running`
        → the worker stops at the next step boundary and rolls back what the
        op's rollback covers (`rollback` on the job says how far). A parked
        `awaiting_cutover` job is cancelled by its rollback path. A finished
        job is 409 `refused`. `requires_confirm` is true when a rollback would
        run.
      tags: [Jobs, Operations]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpRequest" }
      responses:
        "200": { $ref: "#/components/responses/PlanResponse" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "428": { $ref: "#/components/responses/ConfirmRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/settings:
    get:
      operationId: ctlSettingsGet
      summary: Fleet-level settings
      description: >-
        Retention, default images, default Python env, the ctl block, and the
        backup recipients (read-only). A viewer receives
        `recipients.fingerprints` as an empty list.
      tags: [Settings]
      x-ctl-role: viewer
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      responses:
        "200":
          description: Settings
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: ctlSettingsPut
      summary: Change fleet-level settings
      description: >-
        OPERATOR. The mutation envelope; `args` is a PARTIAL
        `settings_response.json` — only `retention`, `images` (choosing among
        SIFs already on disk, by digest) and `ctl` may appear; `recipients`,
        `python_env_default` and `registry_generation` in `args` are 409
        `refused` (CLI-only). Applied as a job under the registry lock so the
        generation moves and every pending plan goes stale, on purpose.
      tags: [Settings, Operations]
      x-ctl-role: operator
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpRequest" }
      responses:
        "200": { $ref: "#/components/responses/PlanResponse" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/BothCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "428": { $ref: "#/components/responses/ConfirmRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  headers:
    XRequestId:
      description: >-
        The server-generated correlation id for this request (16 lowercase hex
        characters), on every log line and audit row the request produced, and
        repeated as `request_id` in every error body. Present on EVERY
        response of every operation, success and error alike. Always generated
        by the daemon; an inbound `X-Request-Id` is recorded as `upstream_rid`
        when it matches `^[A-Za-z0-9._-]{1,64}$` and dropped otherwise, never
        echoed — the same rule as the tenant contract.
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"

  parameters:
    TenantName:
      name: name
      in: path
      required: true
      description: Registry key of the tenant.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
    TenantFilter:
      name: tenant
      in: query
      required: false
      description: Restrict to one tenant.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
    JobId:
      name: id
      in: path
      required: true
      description: Job ULID.
      schema: { type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
    StepN:
      name: n
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Lines:
      name: lines
      in: query
      required: false
      description: How many lines from the end. Capped at 5000.
      schema: { type: integer, minimum: 1, maximum: 5000, default: 200 }
    Verb:
      name: verb
      in: path
      required: true
      description: >-
        The operation. `update-code` is v1.1 and is refused with 409 until
        then; every other verb is planned and executed by the job engine.
      schema:
        type: string
        enum:
          - start
          - stop
          - restart
          - backup
          - restore
          - handover
          - migrate-local
          - decommission
          - key-mint
          - key-revoke
          - admin-add
          - admin-remove
          - sa-create
          - sa-disable
          - sa-enable
          - env-set
          - env-unset
          - env-normalize
          - render-units
          - update-code

  responses:
    PlanResponse:
      description: >-
        `dry_run: true` — the plan. Nothing was locked or written. The
        `plan_hash` and, when `requires_confirm`, the `confirm_value` are what
        the execute call must reproduce.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Plan" }
    JobAccepted:
      description: >-
        `dry_run: false` — the job was persisted and (unless queued behind a
        lock) started. Poll `GET /v1/jobs/{id}`. A retry under the same
        idempotency key with the same request returns THIS job again with the
        same `id`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Location:
          description: "`/v1/jobs/{id}` of the accepted job."
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Job" }
    BothCredentials:
      description: >-
        Code `both_credentials`. `X-API-Key` and `Authorization` were both
        present, or the body's `ctl_api_key` differs from the header key.
        Which credential authenticated must never be ambiguous, so the request
        is refused before either is verified.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >-
        Code `auth_required`. No credential; a malformed `Authorization`
        value; an unknown or revoked key; a BV-BRC token whose expiry has
        passed or whose signature does not verify against the pinned issuer
        allowlist; an unknown or expired session. The body does not say which.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        Code `forbidden`. The credential VERIFIED, and either its subject is
        not on the control plane's principal list (there is no default role —
        a valid BV-BRC user who is not an enrolled viewer or operator lands
        here, not on 401 and not on a read-only default) or its role is below
        the operation's minimum (`x-ctl-role`). Evaluated before any path
        parameter is resolved.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Code `not_found`. Unknown tenant, job or step.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: >-
        Code `validation`. A path or query parameter outside its schema, a body
        that does not match the envelope, or `args` that do not match
        `x-ctl-op-args[verb]`. `extra.fields` lists the offending members.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >-
        One of the 409 codes; `extra` carries the specifics. `locked`: another
        job holds a needed lock (`extra.job_id`, `extra.since`). `plan_stale`:
        the plan recomputed after locking differs (`extra.plan_hash`,
        `extra.registry_generation`). `duplicate`: the idempotency key was
        used with a different request (`extra.job_id` of the original).
        `doctor_red`: a red finding on the op's scope (`extra.doctor_hash`).
        `refused`: a capability, fencing, ownership, containment or
        state-machine refusal — the tenant is not in a state the op accepts, a
        store has `capabilities.<x>: false`, the job is not in a state the
        continuation accepts, the verb is not yet implemented.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConfirmRequired:
      description: >-
        Code `confirm_required`. The plan is destructive (`requires_confirm`)
        and the request's `confirm` is absent or differs from
        `extra.confirm_value`. Re-send with `confirm` set to that value.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >-
        Code `rate_limited`. Per `sha256(credential)` and a global tarpit (all
        public traffic shares one `$remote_addr`, so the address is useless as
        a key). `Retry-After` in seconds; also in `extra.retry_after`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        A control-plane key, minted on the CLI (`ragstack-ctl key mint` on the
        ctl itself, distinct from tenant keys) and bound server-side to
        `{principal, role, revocation_id}`. Never carries a role claim. The
        credential a CLI or script uses for everything, and the credential a
        browser re-presents in a mutation body (`ctl_api_key`) without ever
        storing it. Presenting it together with `Authorization` is a 400.
    BearerIdentity:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        `Authorization: Bearer <BV-BRC token>` (the `Bearer ` prefix is
        optional, as in the tenant contract, because the token wire format
        carries no scheme). Verified against a PINNED issuer allowlist before
        any fetch, expiry before signature, 60 s minimum refetch. The subject
        is `bvbrc:<un>`; its role is looked up from the ctl's principal list
        and a subject not on that list is 403 — never a default role. The
        credential a browser holds after the BV-BRC login (exchanged for a
        session via `POST /v1/session`) and the credential of a human on the
        CLI without a key. Presenting it together with `X-API-Key` is a 400.
    SessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        `Authorization: Session <id>` — the opaque 64-hex session id from
        `POST /v1/session`, kept in `sessionStorage` by the admin UI. Reads
        only: every operation that mutates requires `ctl_api_key` in its body
        when authenticated this way, and `GET /v1/jobs/{id}/secrets` does not
        accept a session at all. Expires 8 h after creation; revoked by
        `DELETE /v1/session`.

  schemas:
    Error: { $ref: "./schemas/error.json" }
    HealthResponse: { $ref: "./schemas/health_response.json" }
    VersionResponse: { $ref: "./schemas/version_response.json" }
    MeResponse: { $ref: "./schemas/me_response.json" }
    SessionResponse: { $ref: "./schemas/session_response.json" }
    FleetResponse: { $ref: "./schemas/fleet_response.json" }
    Registry: { $ref: "./schemas/registry.json" }
    TenantResponse: { $ref: "./schemas/tenant_response.json" }
    TenantsResponse: { $ref: "./schemas/tenants_response.json" }
    EnvResponse: { $ref: "./schemas/env_response.json" }
    LogsResponse: { $ref: "./schemas/logs_response.json" }
    DoctorResponse: { $ref: "./schemas/doctor_response.json" }
    Plan: { $ref: "./schemas/plan.json" }
    Job: { $ref: "./schemas/job.json" }
    JobsResponse: { $ref: "./schemas/jobs_response.json" }
    AuditResponse: { $ref: "./schemas/audit_response.json" }
    SecretsResponse: { $ref: "./schemas/secrets_response.json" }
    GatewayStatus: { $ref: "./schemas/gateway_status.json" }
    GatewayRenderResponse: { $ref: "./schemas/gateway_render_response.json" }
    SettingsResponse: { $ref: "./schemas/settings_response.json" }
    OpRequest: { $ref: "./schemas/op_request.json" }
    CreateRequest: { $ref: "./schemas/create_request.json" }
    BundleManifest: { $ref: "./schemas/bundle_manifest.json" }
    StepLogResponse:
      description: >-
        Tail of one step log. Same bound and redaction as `LogsResponse`; the
        only inline schema in this file because it is a trivial projection of
        that one keyed by job and step instead of tenant and file.
      type: object
      required: [job_id, step, lines, requested, returned, truncated, redacted]
      properties:
        job_id: { type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        step: { type: integer, minimum: 1 }
        lines: { type: array, items: { type: string } }
        requested: { type: integer, minimum: 1, maximum: 5000 }
        returned: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        redacted: { type: boolean, const: true }
      additionalProperties: false
