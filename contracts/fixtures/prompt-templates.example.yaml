# The prose counterpart. `output: text` carries no columns, so a client renders
# the answer as prose rather than trying to parse a table out of it.
- id: literature-summary
  version: 1
  label: Literature summary
  output: text
  slots:
    - {name: organism, required: true, max_len: 120, label: Organism of interest}
    - {name: genes, required: false, max_len: 200, label: Genes of interest}
    - {name: other_terms, required: false, max_len: 200, label: Other terms}
  system: >-
    You answer questions about scientific literature using ONLY the provided
    context passages. If the context does not contain the answer, say you do not
    know rather than inventing one. Cite the passages you used as [n].
  user: |
    Based on the literature context below, provide a comprehensive answer about relevant findings for organism "{{organism}}"{{#genes}} involving genes/proteins: {{genes}}{{/genes}}{{#other_terms}}, related to: {{other_terms}}{{/other_terms}}.

    Summarize the key findings, citing the source references where appropriate. Organize by gene/protein if multiple are discussed.

    --- LITERATURE CONTEXT ---

    {{context}}
