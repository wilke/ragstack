openapi: "3.1.0"
info:
  title: RAGStack API
  description: Production-grade Retrieval-Augmented Generation platform.
  version: "0.1.0"

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/query:
    post:
      operationId: query
      summary: Full RAG pipeline (rewrite, retrieve, rerank, generate)
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query response with answer and sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "422":
          description: Validation error

  /v1/retrieve:
    post:
      operationId: retrieve
      summary: Retrieve relevant chunks without generating an answer
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieved sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
        "422":
          description: Validation error

  /v1/ingest:
    post:
      operationId: ingest
      summary: Ingest a document or directory
      description: >
        Accepts a file or directory for ingestion and processes it in the
        background. A directory is ingested recursively (.pdf/.txt/.md), one
        document per item. Returns immediately with a job_id and status
        "accepted"; poll /v1/ingest/{job_id} for progress, including per-document
        item counts.


        Re-ingesting the same source replaces that document's existing chunks
        (matched by a deterministic document id) rather than duplicating them.
        A re-ingest that yields no embeddable chunks — an empty document, or one
        whose chunks all fail embedding — fails the job and leaves the prior
        version intact; it does not remove the document. To delete a document,
        use DELETE /v1/documents/{id}.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Ingestion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "422":
          description: Validation error

  /v1/ingest/{job_id}:
    get:
      operationId: ingestStatus
      summary: Poll ingestion job status
      description: >
        Reports job status, one of: accepted, running, completed, failed.
        An unknown job_id returns status "unknown" with HTTP 200.
      tags: [Documents]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingestion job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /v1/documents:
    get:
      operationId: listDocuments
      summary: List all indexed documents
      tags: [Documents]
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"

  /v1/documents/{doc_id}:
    delete:
      operationId: deleteDocument
      summary: Delete a document and all its chunks
      tags: [Documents]
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted

  /v1/graph/entities:
    get:
      operationId: listEntities
      summary: List entities in the knowledge graph
      tags: [Graph]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityInfo"

  /v1/graph/neighbors/{entity}:
    get:
      operationId: getNeighbors
      summary: Get entity neighborhood triples
      tags: [Graph]
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: Triples in entity neighborhood
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripleResponse"

  /v1/config:
    get:
      operationId: getConfig
      summary: Effective operational configuration (admin only)
      description: >-
        Allowlisted, non-sensitive runtime config for the sysadmin dashboard.
        Requires the `admin` role. Secrets (API keys, passwords, DSNs, the
        api_key_tenants/api_key_roles maps) are never returned.
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Allowlisted operational config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: Missing or invalid API key
        "403":
          description: Authenticated but insufficient role (admin required)

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Per-caller key mapped server-side to a tenant (data isolation) and an
        RBAC role (admin | engineer | manager | researcher). Roles are enforced
        per-endpoint server-side; some routes (e.g. /v1/config, /v1/admin/*)
        require the admin role and return 403 otherwise.
  schemas:
    ConfigResponse:
      type: object
      description: Allowlisted operational config — no secrets are ever included.
      required:
        - vector_backend
        - text_backend
        - graph_backend
        - job_store_backend
        - require_durable_backends
        - qdrant_url
        - qdrant_collection
        - qdrant_collection_explicit
        - elasticsearch_url
        - elasticsearch_index
        - neo4j_uri
        - embedding_api
        - embedding_model
        - embedding_model_dim
        - embedding_endpoints
        - embedding_max_concurrency
        - chunk_method
        - chunk_size
        - chunk_overlap
        - chunk_max_tokens
        - chunk_token_counter
        - top_k
        - rerank_enabled
        - rerank_candidates
        - reranker_model
        - crossencoder_sidecar_url
        - kg_extraction_enabled
        - ingest_concurrency
        - ingest_shard_size
        - tenant_max_concurrency
        - max_document_bytes
        - log_level
      properties:
        vector_backend: { type: string }
        text_backend: { type: string }
        graph_backend: { type: string }
        job_store_backend: { type: string }
        require_durable_backends: { type: boolean }
        qdrant_url: { type: string }
        qdrant_collection: { type: string }
        qdrant_collection_explicit: { type: string }
        elasticsearch_url: { type: string }
        elasticsearch_index: { type: string }
        neo4j_uri: { type: string }
        embedding_api: { type: string }
        embedding_model: { type: string }
        embedding_model_dim: { type: integer }
        embedding_endpoints:
          type: array
          items: { type: string }
        embedding_max_concurrency: { type: integer }
        chunk_method: { type: string }
        chunk_size: { type: integer }
        chunk_overlap: { type: integer }
        chunk_max_tokens: { type: [integer, "null"] }
        chunk_token_counter: { type: string }
        top_k: { type: integer }
        rerank_enabled: { type: boolean }
        rerank_candidates: { type: integer }
        reranker_model: { type: string }
        crossencoder_sidecar_url: { type: string }
        kg_extraction_enabled: { type: boolean }
        ingest_concurrency: { type: integer }
        ingest_shard_size: { type: integer }
        tenant_max_concurrency: { type: integer }
        max_document_bytes: { type: integer }
        log_level: { type: string }
      additionalProperties: false
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        rewrite_strategies:
          type: array
          items:
            type: string
          default: ["passthrough"]
        filters:
          type: object
          default: {}
        use_graph:
          type: boolean
          default: true
        stream:
          type: boolean
          default: false
        rerank:
          description: >-
            Per-request rerank control. null (default) preserves the
            server-wide default (rerank iff a reranker is configured); false
            forces a rerank skip; true is a no-op when no reranker is wired.
          type: [boolean, "null"]
          default: null
        rerank_candidates:
          description: >-
            Override for the candidate-pool depth fed to the reranker. null
            (default) uses the server default (max(top_k, server's
            rerank_candidates)).
          type: [integer, "null"]
          minimum: 1
          default: null

    QueryResponse:
      type: object
      required: [answer, sources, rewritten_queries]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        rewritten_queries:
          type: array
          items:
            type: string

    RetrieveRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        filters:
          type: object
          default: {}
        use_graph:
          type: boolean
          default: true
        rerank:
          description: >-
            Per-request rerank control. null (default) preserves the
            server-wide default (rerank iff a reranker is configured); false
            forces a rerank skip; true is a no-op when no reranker is wired.
          type: [boolean, "null"]
          default: null
        rerank_candidates:
          description: >-
            Override for the candidate-pool depth fed to the reranker. null
            (default) uses the server default (max(top_k, server's
            rerank_candidates)).
          type: [integer, "null"]
          minimum: 1
          default: null

    RetrieveResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    IngestRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
        metadata:
          type: object
          default: {}

    IngestResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
        chunk_ids:
          type: array
          items:
            type: string
          default: []
        items:
          type: [object, "null"]
          description: Per-document progress for batch/directory ingests.
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            pending:
              type: integer

    DocumentInfo:
      type: object
      required: [doc_id, source]
      properties:
        doc_id:
          type: string
        source:
          type: string
        metadata:
          type: object
          default: {}

    EntityInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
        triple_count:
          type: integer
          default: 0

    TripleResponse:
      type: object
      required: [subject, predicate, object]
      properties:
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string

    Source:
      type: object
      required: [doc_id, chunk_id, content, score]
      properties:
        doc_id:
          type: string
        chunk_id:
          type: string
        content:
          type: string
        score:
          type: number
        metadata:
          type: object
          default: {}
