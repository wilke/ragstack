openapi: "3.1.0"
info:
  title: RAGStack API
  description: >-
    Production-grade Retrieval-Augmented Generation platform.


    Paths are relative to the mount point. This file declares no `servers` entry
    because the API is normally served at the root — but a deployment behind a
    path-stripping reverse proxy (the gateway publishes each tenant at
    `/ragstack/<tenant>/api/...`) adds that prefix as the first `servers` entry of
    the schema it serves at `/openapi.json`, taken from the proxy's
    `X-Forwarded-Prefix` header or the `ROOT_PATH` setting. Clients that fetch the
    live schema should resolve paths against `servers[0].url` when it is present.


    Every response carries an `X-Request-Id` header — the server-generated
    correlation id for that request, which is also on its log lines. See
    `components/headers/XRequestId` for the generation rule, why an inbound
    `X-Request-ID` is recorded but never echoed, and the one documented gap. It
    is referenced explicitly only on the operations the conformance suite
    asserts it on; it is present on all of them.
  version: "0.1.0"

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/query:
    post:
      operationId: query
      summary: Full RAG pipeline (rewrite, retrieve, rerank, generate)
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query response with answer and sources
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "404":
          description: >-
            Unknown collection, or one the caller may not read — a read denial is
            reported as 404, not 403, so a private collection's existence is not
            leaked (ADR-0003 §2). With `collections`, any one member unknown or
            unreadable is a 404 for the whole request, before any retrieval
            runs (#253).
        "422":
          description: >-
            Validation error — including `collections` together with
            `collection`, more than 5 ids, duplicates, or an empty list (#253).
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR the
            collection is `dormant` / `restoring` (#358): the first
            authenticated read or ingest of a dormant collection submits a
            restore from its Workspace archive (as the caller, with the caller's
            token) and answers 503 while the restore runs — retry after the
            delay named in `Retry-After` (seconds). A keyless / API-key caller
            carries no user token, cannot trigger the restore, and gets 503
            with a message saying so. A second cause on a dormant collection
            (#381): the tenant is at capacity — the active bound
            (`max_collections`) is met and no active collection can be evicted
            to make room — so the restore is NOT submitted, the row stays
            `dormant`, and the message names the reason; retry after
            `Retry-After`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the lifecycle
                (dormant / restoring / at capacity) case.
              required: false
              schema:
                type: integer

  /v1/retrieve:
    post:
      operationId: retrieve
      summary: Retrieve relevant chunks without generating an answer
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieved sources
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
        "404":
          description: >-
            Unknown collection, or one the caller may not read (a read denial is a
            404, not a 403 — collection existence is not leaked, ADR-0003 §2).
            With `collections`, any one member unknown or unreadable is a 404
            for the whole request, before any retrieval runs (#253).
        "422":
          description: >-
            Validation error — including `collections` together with
            `collection`, more than 5 ids, duplicates, or an empty list (#253).
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR the
            collection is `dormant` / `restoring` (#358): the first
            authenticated read or ingest of a dormant collection submits a
            restore from its Workspace archive (as the caller, with the caller's
            token) and answers 503 while the restore runs — retry after the
            delay named in `Retry-After` (seconds). A keyless / API-key caller
            carries no user token, cannot trigger the restore, and gets 503
            with a message saying so. A second cause on a dormant collection
            (#381): the tenant is at capacity — the active bound
            (`max_collections`) is met and no active collection can be evicted
            to make room — so the restore is NOT submitted, the row stays
            `dormant`, and the message names the reason; retry after
            `Retry-After`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the lifecycle
                (dormant / restoring / at capacity) case.
              required: false
              schema:
                type: integer

  /v1/ingest:
    post:
      operationId: ingest
      summary: Ingest a document or directory
      description: >
        Accepts a file or directory for ingestion and processes it in the
        background. A directory is ingested recursively (.pdf/.txt/.md), one
        document per item. Returns immediately with a job_id and status
        "accepted"; poll /v1/ingest/{job_id} for progress, including per-document
        item counts.


        Re-ingesting the same source replaces that document's existing chunks
        (matched by a deterministic document id) rather than duplicating them.
        A re-ingest that yields no embeddable chunks — an empty document, or one
        whose chunks all fail embedding — fails the job and leaves the prior
        version intact; it does not remove the document. To delete a document,
        use DELETE /v1/documents/{id}.


        Requires the server to be configured with an ingest root (INGEST_ROOT)
        confining `source` to a directory tree. Without one the endpoint is
        disabled and every request returns 503: an unconfined `source` would be
        an arbitrary server-side file read whose text is retrievable back through
        /v1/retrieve.
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Ingestion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "403":
          description: >-
            The caller can read the named non-default collection but does not own
            it — ingest there is owner-or-admin (ADR-0003; write shares
            deferred). Ingest into the default collection needs read access only
            (writes there are isolated per-tenant by chunk stamping).
        "404":
          description: >-
            Unknown collection, one out of the caller's allowlist, or one the
            caller may not read — an unreadable collection is reported exactly
            like an unknown one so its existence is not leaked (ADR-0003 §2).
        "413":
          description: The JSON request body exceeds max_json_body_bytes (default 1 MB).
        "422":
          description: Validation error
        "429":
          description: >-
            Rate limit exceeded (issue #87): more than
            rate_limit_ingest_per_hour requests from this principal in the last
            hour — the bucket is shared with POST /v1/ingest/upload. An admin
            principal is exempt from this bucket (but not from the request
            bounds above). Retry after the delay named in the `Retry-After`
            header (seconds).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Ingest is disabled — the server has no INGEST_ROOT configured, so
            `source` cannot be confined; OR the authorization store is
            unavailable (fail closed); OR the target collection is `dormant` /
            `restoring` (#358): the first authenticated read or ingest of a
            dormant collection submits a restore from its Workspace archive (as
            the caller, with the caller's token) and answers 503 while it runs —
            retry after the delay in `Retry-After` (seconds). A keyless /
            API-key caller carries no user token, cannot trigger the restore,
            and gets 503 with a message saying so. A second cause on a dormant
            collection (#381): the tenant is at capacity — the active bound is
            met and nothing can be evicted to make room — so the restore is
            NOT submitted, the row stays `dormant`, and the message names the
            reason.
          headers:
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the rate-limit
                and lifecycle (dormant / restoring / at capacity) cases.
              required: false
              schema:
                type: integer

  /v1/ingest/upload:
    post:
      operationId: ingestUpload
      summary: Upload files for ingestion
      description: >
        Multipart counterpart to POST /v1/ingest: instead of a server-side path,
        the caller uploads one or more files. Each file is staged under a
        per-tenant, per-job directory below INGEST_ROOT with a sanitized,
        traversal-confined filename, then the same background ingest path runs
        over it. Returns 202 with a job_id and status "accepted"; poll
        GET /v1/ingest/{job_id} for progress exactly as for a path ingest.


        The tenant is derived server-side from the API key (never from the body).
        Bounds (#202), all checked before anything is staged or written: each
        file's content type must be in the deployment's upload_content_types
        allowlist (default application/pdf, text/plain, text/markdown and
        application/xml or text/xml for JATS) and a PDF must start with %PDF
        (415 otherwise); a file larger than max_document_bytes, more than
        max_upload_files files, or files totalling more than
        max_upload_bytes_per_request are 413 — checked against the declared
        sizes before anything is staged or written, and re-checked while the
        files stream out of the server's spool, so nothing oversized reaches
        the Workspace or INGEST_ROOT. Before the body is read at all, a request
        whose Content-Length exceeds max_upload_bytes_per_request (plus
        multipart framing) is refused with 413 and one without a
        Content-Length (chunked) with 411; the deployment gateway must enforce
        a body cap of about MAX_UPLOAD_BYTES_PER_REQUEST — a client that lies
        about Content-Length is only stopped there. One ingest job per
        principal at a time: while a
        job of the caller's is still accepted or running, a new upload is 429
        with Retry-After (an admin principal is exempt). Requires INGEST_ROOT to
        be configured when ingest_backend=local — without one, uploads have
        nowhere confined to land and every request returns 503 (matching
        POST /v1/ingest); under ingest_backend=gowe the files go to the caller's
        Workspace and INGEST_ROOT is not used.
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  description: >-
                    One or more files to ingest — PDF, plain text, Markdown, or
                    JATS XML (the upload_content_types allowlist).
                  items:
                    type: string
                    format: binary
                collection:
                  type: string
                  description: >
                    Optional target collection id (same semantics as
                    IngestRequest.collection); omit for the server default.
      responses:
        "202":
          description: Upload accepted and queued for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "403":
          description: >-
            The caller can read the named non-default collection but does not own
            it — ingest there is owner-or-admin (ADR-0003; write shares
            deferred). Ingest into the default collection needs read access only
            (writes there are isolated per-tenant by chunk stamping).
        "404":
          description: >-
            Unknown collection, one out of the caller's allowlist, or one the
            caller may not read (unreadable == unknown, so existence is not
            leaked — ADR-0003 §2).
        "411":
          description: >-
            The request has no Content-Length (chunked transfer encoding); an
            upload must declare its length so it can be bounded before the
            body is read (#202).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "413":
          description: >-
            A file exceeds max_document_bytes, more than max_upload_files files,
            or the request's files total more than max_upload_bytes_per_request
            (#202). Checked against the declared sizes before anything is
            staged or written (and re-checked while the files stream out of
            the server's spool); a Content-Length over
            max_upload_bytes_per_request plus multipart framing is refused
            before the body is read. The deployment gateway must enforce a
            body cap of about MAX_UPLOAD_BYTES_PER_REQUEST — a client that lies
            about Content-Length is only stopped there.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "415":
          description: >-
            An uploaded file's content type is not in the upload_content_types
            allowlist, or a file declared as application/pdf does not start
            with %PDF (#202).
        "422":
          description: Validation error
        "429":
          description: >-
            Either the rate limit was exceeded (issue #87: more than
            rate_limit_ingest_per_hour requests from this principal in the last
            hour — the bucket is shared with POST /v1/ingest), or an ingest job
            of this principal's is still in flight (#202: one accepted/running
            job per principal at a time — poll GET /v1/ingest/{job_id} and retry
            once it is completed or failed). An admin principal is exempt from
            both (but not from the request bounds). Retry after the delay named
            in the `Retry-After` header (seconds).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Ingest is disabled — the server has no INGEST_ROOT configured, so
            uploads cannot be confined; OR the authorization store is
            unavailable (fail closed); OR the target collection is `dormant` /
            `restoring` (#358) — see POST /v1/ingest: a restore is submitted as
            the caller and the request answers 503 with `Retry-After` while it
            runs; a keyless / API-key caller cannot trigger it; and at
            capacity (#381 — the active bound is met and nothing can be
            evicted) the restore is not submitted, the row stays `dormant`
            and the message says so.
          headers:
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the rate-limit
                and lifecycle (dormant / restoring / at capacity) cases.
              required: false
              schema:
                type: integer

  /v1/ingest/{job_id}:
    get:
      operationId: ingestStatus
      summary: Poll ingestion job status
      description: >
        Reports job status, one of: accepted, running, completed, failed.
        An unknown job_id returns status "unknown" with HTTP 200.
      tags: [Documents]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingestion job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /v1/documents:
    get:
      operationId: listDocuments
      summary: List indexed documents visible to the caller (own tenant + public)
      description: >-
        Documents are aggregated from the served text index by doc_id (not the
        job registry, so bulk/CLI-ingested corpora are included), scoped to the
        caller's readable tenants. Paginate with `limit` and the opaque `cursor`
        echoed from the prior response's `X-Next-Cursor` header.
      tags: [Documents]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum documents per page (1–500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from a prior response's X-Next-Cursor header.
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          headers:
            X-Next-Cursor:
              description: >-
                Opaque cursor for the next page; present only when more documents
                remain. Pass it back as the `cursor` query parameter.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"
        "400":
          description: Malformed pagination cursor
        "404":
          description: >-
            The caller may not read the (default) collection the listing targets
            — reported as 404, not 403, so existence is not leaked (ADR-0003 §2).
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR the
            collection is `dormant` / `restoring` (#358): the first
            authenticated read or ingest of a dormant collection submits a
            restore from its Workspace archive (as the caller, with the caller's
            token) and answers 503 while the restore runs — retry after the
            delay named in `Retry-After` (seconds). A keyless / API-key caller
            carries no user token, cannot trigger the restore, and gets 503
            with a message saying so. A second cause on a dormant collection
            (#381): the tenant is at capacity — the active bound
            (`max_collections`) is met and no active collection can be evicted
            to make room — so the restore is NOT submitted, the row stays
            `dormant`, and the message names the reason; retry after
            `Retry-After`.
          headers:
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the lifecycle
                (dormant / restoring / at capacity) case.
              required: false
              schema:
                type: integer

  /v1/documents/{doc_id}:
    delete:
      operationId: deleteDocument
      summary: Delete a document and all its chunks
      description: >-
        Scoped to the caller's own tenant — one tenant can never delete
        another's document, even by id. Targets the default collection's stores;
        like ingest into it, the gate is READ access to that shared collection
        (the per-tenant chunk stamp is the write isolation there, ADR-0003 §3).
      tags: [Documents]
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted
        "404":
          description: >-
            The caller may not read the (default) collection the delete targets —
            reported as 404, not 403, so existence is not leaked (ADR-0003 §2).
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR the
            collection is `dormant` / `restoring` (#358): the first
            authenticated read or ingest of a dormant collection submits a
            restore from its Workspace archive (as the caller, with the caller's
            token) and answers 503 while the restore runs — retry after the
            delay named in `Retry-After` (seconds). A keyless / API-key caller
            carries no user token, cannot trigger the restore, and gets 503
            with a message saying so. A second cause on a dormant collection
            (#381): the tenant is at capacity — the active bound
            (`max_collections`) is met and no active collection can be evicted
            to make room — so the restore is NOT submitted, the row stays
            `dormant`, and the message names the reason; retry after
            `Retry-After`.
          headers:
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the lifecycle
                (dormant / restoring / at capacity) case.
              required: false
              schema:
                type: integer

  /v1/graph/entities:
    get:
      operationId: listEntities
      summary: List entities in the knowledge graph
      tags: [Graph]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entities returned (1–500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityInfo"
        "422":
          description: limit is out of bounds (issue #87).

  /v1/graph/neighbors/{entity}:
    get:
      operationId: getNeighbors
      summary: Get entity neighborhood triples
      tags: [Graph]
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: Triples in entity neighborhood
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripleResponse"

  /v1/config:
    get:
      operationId: getConfig
      summary: Effective operational configuration (admin only)
      description: >-
        Allowlisted, non-sensitive runtime config for the sysadmin dashboard.
        Requires the `admin` role. Secrets (API keys, passwords, DSNs, the
        api_key_tenants/api_key_roles maps) are never returned.
      tags: [Admin]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Allowlisted operational config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Authenticated but insufficient role (admin required)

  /v1/admin/models/registry:
    get:
      operationId: listRegisteredModels
      summary: Registered models + hot-swappable assignments (admin only)
      description: >-
        The runtime model registry: models registered for the pipeline's tasks
        (embedding, tokenizer, llm, reranker) plus the current hot-swappable
        assignments (llm / reranker). Admin only.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      responses:
        "200":
          description: Registry snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsRegistryResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
    post:
      operationId: registerModel
      summary: Register a model (admin only)
      description: >-
        Register a model for a task. `base_urls` must pass the server's SSRF
        allowlist. A duplicate id is a 400 (use PUT to update).
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelEntry" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEntry" }
        "400": { description: Invalid entry (bad task/provider, SSRF, duplicate id) }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }

  /v1/admin/models/registry/{model_id}:
    put:
      operationId: updateRegisteredModel
      summary: Replace a registered model (admin only)
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelEntry" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEntry" }
        "400": { description: Invalid entry }
        "404": { description: Unknown model }
    delete:
      operationId: deleteRegisteredModel
      summary: Remove a registered model (admin only)
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { description: Unknown model }
        "409": { description: Model is assigned to a task; unassign first }

  /v1/admin/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List registered service accounts (admin only)
      description: >-
        Every registered machine identity, oldest first, including disabled ones
        (disabling is soft state, not a deletion — the audit trail is the point).
        The response never carries key material, a key prefix, or a key count:
        the key<->account mapping lives only in the server environment.


        Registration is OPT-IN. An API key whose tenant has no record here keeps
        authenticating exactly as before; this endpoint enumerates the accounts
        an admin chose to register, not every key the server accepts.


        Python-only in v1: the Go implementation has no `X-API-Key`
        authentication path, so it serves no service-account surface.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      responses:
        "200":
          description: The registered service accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountsResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "503":
          description: User/authorization store unavailable — refused (fail closed).
    post:
      operationId: createServiceAccount
      summary: Register a service account (admin only)
      description: >-
        Register a machine identity whose `subject` equals the API-key tenant the
        operator maps its key to. This creates the ACCOUNT RECORD only — it does
        NOT mint, store, or rotate a credential. `API_KEYS`, `API_KEY_TENANTS`
        and `API_KEY_ROLES` are environment settings with no writer in the
        server; provisioning a key is an operator edit plus a restart, and both
        the key AND its tenant mapping must be added in the SAME edit or the
        next startup fails its production settings check.


        `subject` must be colon-free (a 400 otherwise): ':' is reserved for
        federated `issuer:sub` identities, which is what keeps a service account
        structurally unable to collide with — or be impersonated by — a bearer
        identity. It must also not be one of the reserved tenants `default` /
        `public` (400): every valid but unmapped API key resolves to `default`,
        so registering it and disabling it would 401 every such caller at once,
        including the admin key needed to call `/enable`. Re-registering an
        existing service account is a no-op that returns the stored row unchanged
        (201), so a provisioning script is re-runnable; a subject that already
        exists as a human account is a 409.


        To then grant the account read on a collection, or add it to a group, use
        the `@service:<subject>` grantee/member form — a bare subject is
        qualified to `bvbrc:<subject>` and would create a grant for a federated
        identity that never authenticates.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAccountCreateRequest" }
      responses:
        "201":
          description: The account was registered (or already existed); the row is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountRecord" }
        "400":
          description: >-
            A colon-bearing, empty, over-long or whitespace-only subject, or one
            of the reserved `default` / `public` tenants
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "409":
          description: >-
            The subject already exists as a human (federated) account; converting
            a person's row into a machine credential is refused
        "422": { description: A malformed body (missing `subject`, unknown field) }
        "503":
          description: User/authorization store unavailable — refused (fail closed).

  /v1/admin/service-accounts/{subject}/disable:
    post:
      operationId: disableServiceAccount
      summary: Disable a service account (admin only)
      description: >-
        Soft-disable the account: `disabled_by`/`disabled_at` are stamped and the
        row is kept (never a DELETE). Its API key is then rejected with 401 on
        the API-key auth path — within the server's disabled-check cache TTL,
        which IS the revocation lag.


        Disabling the account YOU are authenticating as is refused (409): the
        check runs on the same API-key path, so the next request — including the
        `/enable` that would undo it — would be a 401 with no way back through
        the API. Use another admin credential.


        This is a SOFT, BEST-EFFORT revoke. The auth-time check FAILS OPEN: if
        the user store cannot answer, the request proceeds on the strength of the
        verified key, because trading a total outage of the API-key surface for a
        revocation convenience is a bad bargain. The AUTHORITATIVE revoke is
        removing the key from `API_KEYS` (and `API_KEY_TENANTS`) and restarting.


        Idempotent: disabling an already-disabled account is a 204 no-op.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The account is disabled }
        "400": { description: A colon-bearing, empty, over-long or whitespace-only subject }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "404": { description: No service account with that subject }
        "409":
          description: >-
            The subject exists but is a human account (only service accounts
            toggle here), or it is the account the caller is authenticating as
            (self-lockout is refused)
        "503":
          description: User/authorization store unavailable — refused (fail closed).

  /v1/admin/service-accounts/{subject}/enable:
    post:
      operationId: enableServiceAccount
      summary: Re-enable a disabled service account (admin only)
      description: >-
        Clear the disabled state and stamp `enabled_by`/`enabled_at`. The
        account's key authenticates again within the disabled-check cache TTL.
        Idempotent: enabling an already active account is a 204 no-op.


        `disabled_by`/`disabled_at` are NOT cleared — they are the record of the
        last revocation, and a re-enable that blanked them would leave a row
        indistinguishable from one nobody ever disabled (ADR-0004 decision 6).
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The account is active }
        "400": { description: A colon-bearing, empty, over-long or whitespace-only subject }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "404": { description: No service account with that subject }
        "409":
          description: The subject exists but is a human account — only service accounts toggle here
        "503":
          description: User/authorization store unavailable — refused (fail closed).

  /v1/admin/users/{subject}/role:
    patch:
      operationId: setUserRole
      summary: Grant or revoke the admin role for a federated user (admin only)
      description: >-
        Set the stored RBAC role of a **federated (bearer) user** row. This is
        the only in-API way a bearer identity becomes `admin`: the bearer auth
        path never inherits `DEFAULT_ROLE`, and nothing in a token — no claim,
        no header — can elevate the caller presenting it. The two admin sources
        are both server-side: this row, and the `ADMIN_SUBJECTS` environment
        allowlist.


        Precedence is one-directional: `ADMIN_SUBJECTS` is checked FIRST and
        short-circuits, so a stored `user` role can never demote an
        env-allowlisted subject. That is what keeps the allowlist a break-glass
        path a database write cannot revoke — and what makes admin reachable on
        an empty users table, which is how a deployment bootstraps its first
        admin at all.


        `subject` must be a federated `issuer:subject` string with both halves
        non-empty (**400** otherwise). Service accounts are refused by that same
        rule and are therefore a **400**, not a 409: their subjects are
        colon-free by invariant, so they never reach the store. An API-key
        principal's role comes from `API_KEY_ROLES`, and letting this surface
        write it would dissolve the disjoint-namespace invariant. The
        target must already have a row — a user who has never authenticated (and
        was never named as a share grantee or group member) is a **404**.


        Revoking the last STORED admin is a **409** — but only when this row is
        the deployment's last admin source of any kind, because the refusal
        exists to prevent an unrecoverable lockout and nothing else. Two sources
        outlive any write here and stand the guard down: a usable
        `ADMIN_SUBJECTS` entry (the break-glass path — an entry whose issuer
        half no configured provider can produce does NOT count, since it can
        never match), and an API key that maps to `admin` through
        `API_KEY_ROLES`/`DEFAULT_ROLE` — which is very often the credential
        making this exact call. Where the 409 does fire, the only ways back are
        a direct users-table write or an environment edit plus a restart.


        An unknown role is a **400** even when it targets the last admin: the
        role vocabulary is validated before the lockout guard, so a typo is
        never answered with a revoke refusal for a revoke nobody asked for.


        The change lands on the auth path within the role-cache TTL
        (`ADMIN_ROLE_CACHE_TTL_SECONDS`) — which is the DEMOTION lag, so it is
        capped at startup. This process flushes its cache immediately; sibling
        workers wait out the TTL.


        Python-only in v1: the Go implementation serves no bearer identity
        surface.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleRequest" }
      responses:
        "200":
          description: The stored role after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRoleRecord" }
        "400":
          description: >-
            An unknown role, or a subject that is empty, over-long, control-bearing
            or not of the federated `issuer:subject` shape. A service account
            lands here rather than on 409: its subject is colon-free by
            invariant, so it fails the federated-subject rule before any store
            call (its role comes from `API_KEY_ROLES`).
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "404": { description: No user row with that subject }
        "409":
          description: >-
            The change would revoke the last stored admin of a deployment that
            has no other admin source. "Other source" is judged on liveness, not
            just configuration: an `ADMIN_SUBJECTS` entry whose issuer half the
            configured identity provider cannot produce does not count, nor does
            an admin API key whose tenant is a disabled service account, and a
            store that cannot answer the latter is treated as no source at all
            (a retryable refusal beats an irreversible lockout).
        "422": { description: "A malformed body (missing `role`, unknown field)" }
        "503":
          description: User/authorization store unavailable — refused (fail closed).

  /v1/admin/collections/evict:
    post:
      operationId: evictCollections
      summary: Evict the k least-recently-accessed archived collections (admin only)
      description: >-
        The operator's handle on the active-collection bound (#359, phase 4 of
        #353). Chooses up to `need` victims — least-recently-accessed first
        among ACTIVE collections whose Workspace archive is current
        (`archive_pending=false`, `versions` non-empty), never one with an
        `accepted`/`running` ingest job, never one whose physical stores are
        the legacy shared surface's (the settings-derived default, or a spec
        that claims its stores — evicting it would destroy every tenant's
        legacy data) or are shared with another registry id — and makes each
        `dormant`: the registry row is compare-and-swapped `active → dormant`
        FIRST (readers immediately get 503 + `Retry-After`), then the Qdrant
        collection and the ES index are dropped, best-effort per target. A
        failed drop leaves the row `dormant` with the leftover named in its
        reason for the store inventory to find; nothing is dropped when the
        swap lost. Only the Workspace archive remains; the first access (or
        `POST /v1/collections/{id}/restore`) restores it.


        `dry_run=true` returns the same plan without acting. Always 200, even
        when fewer than `need` victims exist — `shortfall` counts, per reason,
        why the rest were ineligible. Admin only.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      parameters:
        - name: need
          in: query
          required: false
          description: How many collections to evict (default 1).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: dry_run
          in: query
          required: false
          description: Report the plan without acting (default false).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The victims (acted on, or planned under `dry_run`) and the shortfall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvictionResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "422": { description: "`need` out of range" }

  /v1/admin/config/assignments:
    patch:
      operationId: patchModelAssignments
      summary: Assign registered models to hot-swappable tasks (admin only)
      description: >-
        Bind registered models to hot-swappable tasks (llm / reranker) and apply
        live — the affected client is rebuilt and atomically swapped, no restart.
        Only the fields present are changed; a field set to `null` reverts that
        task to its settings default. Build-time tasks (embedding/chunking) are
        rejected (422) — those changes build a new collection.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentsPatch" }
      responses:
        "200":
          description: Applied; returns the registry snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsRegistryResponse" }
        "400": { description: Unknown model or wrong task for the model }
        "404": { description: Unknown model }
        "422": { description: A non-hot-swappable task was named }

  /v1/admin/log-level:
    get:
      operationId: getLogLevel
      summary: The log level in effect in this process (admin only)
      description: >-
        What the root logger is set to **right now**, what configuration would
        return it to, and which loggers this process is currently overriding or
        damping.


        The configured/effective split matters: `GET /v1/config` echoes the
        **raw** `LOG_LEVEL` string, so a value the server rejected at start-up is
        reported there while INFO is what is actually in force. Here
        `configured_level` is that raw string, `configured_level_resolved` is
        what it resolves to, and `effective_level` is the live root level.


        **It also reports a pending auto-revert.** If a PUT armed a
        `ttl_seconds` expiry, `auto_revert_pending` is true and
        `expires_in_seconds` counts down to the moment this process will change
        its own level back to the configured defaults. An operator has to be able
        to see that the level will move under them, and nothing else in the
        response would say so.


        Runtime state is **process-local and resets on restart** — see the PUT
        below.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      responses:
        "200":
          description: The effective log state of the process that answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogLevelResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
    put:
      operationId: setLogLevel
      summary: Change the log level without restarting (admin only)
      description: >-
        Raise or lower the running process's log level and its per-logger
        overrides, applied live — no restart, in the same spirit as
        `PATCH /v1/admin/config/assignments`. The change takes effect on the very
        next log call.


        **Process-local, and it resets on restart.** That is a feature, not an
        oversight: a debugging session left at DEBUG cannot silently become the
        permanent configuration of a tenant. To make a level stick, change
        `LOG_LEVEL` and restart. `pid` in the response says which process
        answered. Every production launch today is a single uvicorn process with
        no `--workers`, so one call reaches the one process that serves every
        request; were `--workers` ever added, each worker would keep its own
        runtime level and a single call would change exactly one of them at
        random — the log line remains the ground truth in that world.


        **Both fields are optional, but a body needs one of them.** `level` sets
        the root level (case-insensitive; `warn` accepted; `NOTSET` rejected).
        `loggers` is a name→level map with **replace** semantics — what you send
        becomes the complete set of runtime overrides, `{}` clears them all, and
        omitting the field leaves them untouched. Logger names are validated for
        charset and length and **must already exist** in the process:
        `logging.getLogger(name)` creates a logger permanently, so accepting
        arbitrary names would be an unbounded-growth path even behind this gate.
        The number of overrides is capped (`max_logger_overrides`).


        **`ttl_seconds` auto-reverts the change.** Absent or null means no
        expiry — exactly the behaviour this endpoint shipped with, unchanged.
        Set it and the process reverts to the **configured defaults** at the
        deadline: the same end state `DELETE` produces, not a restoration of
        whatever was in force before this PUT. The revert is audited at WARNING
        as `audit=expired`, distinct from an operator's `audit=reset`, and
        carries the principal that armed it — a level change nobody typed has to
        be explainable afterwards. Range 1..86400 seconds (`max_ttl_seconds` in
        the response); out of range is a 422 that applies nothing. A body
        carrying only `ttl_seconds` is refused, because a TTL modifies a change
        and is not one.


        This exists because leaving DEBUG on is expensive and easy to forget:
        httpcore emits roughly **15 log lines per outbound HTTP call**, and DEBUG
        deliberately *releases* the dampen set, so a single `/v1/query` — 5
        outbound calls minimum, ~14 on the multi-collection path — goes from
        about 3 lines to **75–210**. The failure mode is not an attacker; it is
        an admin who turned DEBUG on to investigate something, got interrupted,
        and never came back.


        **A later PUT supersedes an earlier one, expiry included.** Every PUT
        cancels any pending auto-revert *before* applying, and arms a new one
        only if this body carries `ttl_seconds`. Two overlapping TTLs therefore
        cannot exist and cannot fight; the first timer can never fire later and
        clobber the second change. The corollary is worth reading twice: **a
        follow-up PUT that omits `ttl_seconds` disarms the expiry the earlier one
        armed.** That is deliberate — the expiry belongs to the change that
        armed it — and it is visible immediately in the response
        (`auto_revert_pending: false`) and on the audit line, which carries the
        `ttl_seconds`/`expires_at` columns on every change, including the ones
        that clear them. `DELETE` cancels a pending revert too.


        Validation is **atomic**. The whole body is checked before anything is
        applied, so a 422 leaves the effective level exactly as it was.


        **`level` does not govern `uvicorn.*`.** Uvicorn's loggers set
        `propagate=False` and carry their own handlers, so they consult their own
        level and never the root one: `{"level":"CRITICAL"}` leaves uvicorn's
        access line printing, and `{"level":"DEBUG"}` does not turn uvicorn debug
        on. Name `uvicorn`, `uvicorn.error` or `uvicorn.access` in `loggers` to
        reach them — that works, and it is the only way to. The side benefit is
        that a full "denial of observability" is not reachable through this
        endpoint at all: the access log survives any level set here.


        Every accepted change is logged at **WARNING** with the calling principal
        and the before/after, on a logger pinned to WARNING so the record
        survives the very change that raises the threshold. Whoever finds DEBUG
        on in production can find out who turned it on and when.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogLevelRequest" }
      responses:
        "200":
          description: Applied; returns the new effective state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogLevelResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }
        "422":
          description: >-
            An unknown or `NOTSET` level, a body with neither `level` nor
            `loggers`, a `ttl_seconds` outside 1..`max_ttl_seconds` or not an
            integer, a body carrying only `ttl_seconds`, a logger name that fails
            the charset/length rule or does not exist in this process, an attempt
            to override `ragstack.audit`, or more overrides than
            `max_logger_overrides`. Nothing was applied.
    delete:
      operationId: resetLogLevel
      summary: Drop the runtime override and return to the configured level (admin only)
      description: >-
        Clear the runtime root-level override and every per-logger override, and
        re-apply what `LOG_LEVEL` and `LOG_DAMPEN_LOGGERS` configure — the state
        the process would come back to after a restart. The caller does not need
        to know what those values were.


        **Cancels any pending `ttl_seconds` auto-revert**, since it produces that
        revert's end state right now — leaving the timer armed would mean a
        second, pointless "change" landing in the audit trail later. Audited as
        `audit=reset`, which is how an operator's reset is told apart from the
        `audit=expired` line an auto-revert writes.


        Idempotent, always 200 (there is nothing to 404 on: no override is a
        valid state to reset from), and audited at WARNING like a PUT, because a
        reset is a change.
      tags: [Admin]
      security: [{ ApiKeyAuth: [] }, { BearerIdentity: [] }]
      responses:
        "200":
          description: Reset; returns the configured state now back in effect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogLevelResponse" }
        "401": { description: Missing or invalid credential (API key or bearer identity) }
        "403": { description: Admin role required }

  /v1/stats/stores:
    get:
      operationId: statsStores
      summary: Per-store counts, scoped to the caller's readable tenants
      description: >-
        Chunk/document counts for the vector, text, and graph stores, each
        FILTERED to the caller's readable tenants (own + the shared `public`
        corpus) — never a global store total, so a caller can never learn
        another tenant's corpus size. The vector/text counts SUM every
        collection the caller may read (each collection is its own physical
        Qdrant collection / ES index); `/v1/stats/tenants` splits the same
        total per tenant × collection.

        WHICH collections is the caller's allowlist ∩ ownership (the same filter
        `/v1/collections` applies). WHOSE chunks is own+public, WIDENED per
        collection by any share that grants read — the same widening retrieval
        applies — so a count reports what a query over that collection would
        return, never more.

        Cost scales with the number of readable collections (one probe per
        physical store per leg), so poll slowly; the Ops dashboard uses 15s.

        A store that is unavailable or errors degrades to `available: false`
        with a null count (no 500) — a partial sum is never reported as a
        total. The graph count is scoped to at most one collection for a
        confined tenant, so it does not sum the way vector/text do.
      tags: [Stats]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Per-store tenant-scoped counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "503":
          description: >-
            Authorization store unavailable — the counted collections are
            owner-filtered, so it refuses rather than risk counting a
            collection the caller may not read (fail closed).

  /v1/stats/tenants:
    get:
      operationId: statsTenants
      summary: The caller's tenancy — identity, reach, and a per-tenant count breakdown
      description: >-
        Where `/v1/stats/stores` collapses the caller's readable tenants into one
        number per store, this splits that union into a tenant x collection grid,
        so an operator can see which tenant actually owns a corpus (e.g. data
        sitting in `public` rather than the org's own tenant) and per collection
        rather than in aggregate. Also reports the caller's role, its collection
        allowlist (`restricted_to`; null = unrestricted) and whether API-key auth
        is enabled at all. Rows cover the tenants this caller may read, INCLUDING
        a writer-tenant whose data a share makes readable — such a row is scoped
        to the shared collections (other cells are null) and is omitted entirely
        when it carries no chunks, so it never discloses an owner the caller
        could not already see. Columns are only collections the allowlist
        permits, so no corpus size the caller cannot retrieve is revealed. `policy`
        (the full tenant->collections map) names other tenants and is admin-only,
        null otherwise. Each count degrades to null independently.


        This is also the de-facto "who am I" call (there is no `/v1/me`), and the
        grid is what makes it expensive — one count per tenant x collection x
        store, seconds on a large corpus. `counts=false` answers the identity half
        alone: same response shape, every `vector_count`/`text_count` null, and NO
        store probed.
      tags: [Stats]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: counts
          in: query
          required: false
          description: >-
            Count the cells. Pass `false` to resolve identity and reach only —
            every count is null, no store is probed, and no share-derived row is
            resolved (a share row is admissible only when it carries a non-zero
            count, so it cannot be decided without one). Default true.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Tenancy and per-tenant, per-collection counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "503":
          description: >-
            Authorization store unavailable — the per-collection breakdown is
            owner-filtered, so it refuses rather than risk hiding a readable
            collection (fail closed).

  /v1/collections:
    get:
      operationId: listCollections
      summary: Registry collections the query API can serve
      description: >-
        Lists the collections selectable via the `collection` field on /query
        and /retrieve — each with its embedding model/dim, chunk-strategy label,
        default flag, and a chunk count scoped to what this caller can retrieve
        (own + `public`, widened by a read share on that collection; null when
        unavailable). **Owner-filtered**: a caller sees only the collections it
        owns, has been granted, or that are `public` (admins see all). The
        reported `default` is always one of the listed ids — or the empty string
        when `collections` is empty, i.e. the caller can read no collection at
        all — and is the id an omitted `collection` resolves to for this caller
        on /query, /retrieve and /chunks.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Available collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "503":
          description: >-
            Authorization store unavailable — the listing is owner-filtered
            (each entry the caller may read), so it refuses rather than risk
            hiding a readable collection (fail closed).
    post:
      operationId: createCollection
      summary: Create a content-addressed collection (build-time model selection)
      description: >-
        Binds an embedding model and a chunk strategy into a new
        content-addressed collection, returning its `CollectionInfo`. The
        collection is created empty; populate it via POST /v1/ingest with the
        returned id. Build-time config is collection identity — this mints a new
        collection rather than editing an existing one.


        Creation is open to any authenticated principal (ADR-0003: a library is
        a collection users create directly). The `embedding` and `chunk` fields
        are admin-only build-spec overrides: omit them (the common case) and the
        server's default build spec is resolved into concrete values before the
        collection's identity is derived — so a later change of server defaults
        never changes an existing collection. A non-admin supplying either field
        gets a 403.
      tags: [Documents]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreateRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionInfo"
        "400":
          description: Referenced model is not an embedding model, or chunk config is invalid
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: >-
            Non-admin caller and the deployment has closed collection creation
            entirely (`ALLOW_USER_COLLECTION_CREATE=false`, default true — a
            capability gate, e.g. for a read-only service account); or the
            caller supplied the admin-only `embedding`/`chunk` build-spec
            overrides without the admin role (omit both to create from the
            server-default build spec); or the deployment's effective cap is
            zero (`MAX_COLLECTIONS=1` with a shared-surface `default` pointer
            charging the only slot) — a configuration that refuses every
            create rather than a full store, so no eviction is attempted
        "404":
          description: Referenced embedding model is not registered
        "409":
          description: >-
            A collection with the resolved id already exists; or the id is the
            reserved pointer name `default` (it names the collection a request
            resolves to when it omits `collection` — DEFAULT_COLLECTION_ID —
            and is never a collection of its own); or the id carries residual
            access-control state owned by another subject (the create is
            rolled back rather than inheriting it); or the caller already
            owns `max_collections_per_owner` collections (default 5, issue
            #290) — a structured `{owned, limit}` detail, checked atomically
            with the owner-row write. Admin is exempt from this quota (logged),
            but not from `MAX_COLLECTIONS` above (ADR-0005 decision 5 — that
            one is physical protection for the store instances and applies to
            admins too)
        "413":
          description: The JSON request body exceeds max_json_body_bytes (default 1 MB).
        "429":
          description: >-
            Rate limit exceeded (issue #87): more than
            rate_limit_collections_create_per_hour requests from this principal
            in the last hour. An admin principal is exempt from this bucket
            (but not from the request bounds, nor from MAX_COLLECTIONS).
            Retry after the delay named in the `Retry-After` header (seconds).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
        "503":
          description: >-
            Authorization store unavailable — ownership could not be recorded,
            so the create is rolled back (fail closed).
        "507":
          description: >-
            The server's ACTIVE-collection bound (`MAX_COLLECTIONS`, #359) is
            met and nothing can be evicted to make room. Each active
            collection holds physical store resources, so the bound is
            enforced; normally it is met by evicting exactly ONE
            least-recently-accessed active collection whose Workspace archive
            is current (it becomes `dormant` and is restored on its next
            access) and the create proceeds. This response means no candidate
            exists: the `detail` names, per reason, how many collections were
            ineligible — `not_active`, `archive_pending` (last archive step
            failed; the owner's next call retries it), `no_archive` (never
            archived), `in_flight` (an ingest job is running), `protected`
            (the legacy shared surface or a store shared by two registry ids),
            `unregistered` (not served by this process). The bound is taken
            over the **durable registry**, atomically with the id
            reservation, so it includes collections registered by a sibling
            API process, by the bulk CLI, or by hand, and concurrent creates
            cannot overshoot it; a create whose freed slot was taken by a
            concurrent creator is also 507 (retry).

  /v1/collections/{collection_id}:
    delete:
      operationId: deleteCollection
      summary: Unregister a collection, optionally purging its data
      description: >-
        Removes a collection registry entry. Owner-or-admin: a user manages its
        own private collections (ADR-0003 §2), so this is no longer admin-only —
        the caller must own the collection, or be an admin (whose bypass is
        logged).


        `purge=false` drops the *binding* only, leaving the Qdrant collection and
        Elasticsearch index intact — and is therefore **refused (409) unless
        another registry entry still claims that store**. Dropping the last entry
        would leave data no entry claims and no ACL governs, which is ADR-0002
        decision 5 ("a physical index has exactly one registry entry") violated
        toward zero; it also let repeated create/delete cycles accumulate
        orphaned stores without the collection cap ever seeing them.


        Exactly one of the two forms is legal for any collection, so nothing is
        undeletable: a store shared with another entry can be unregistered but
        not purged, and a store this entry alone claims can be purged but not
        unregistered.


        With `purge=true` the physical Qdrant collection, the Elasticsearch index,
        the collection's knowledge-graph triples (every tenant's — the `graph`
        target, present only when a graph backend is configured) and the
        provenance manifest are deleted too. **Irreversible**: the
        embeddings are destroyed and can only be recovered by re-ingesting. The
        response is a 200 `CollectionPurgeReport` describing exactly what was
        removed, what was already absent, and what failed — a partial failure
        (e.g. Qdrant dropped but ES errored) is reported, never rolled back and
        never hidden behind a 500. Purging is idempotent: a target that is
        already gone is listed under `absent`, not an error.


        Purge is refused with 409 for the default collection, and for a
        collection whose physical store is still referenced by another registry
        entry (content-addressed collections built from an identical spec share
        one store) — the 409 message names the other collections.


        Deleting also revokes every ACL row of the collection (owner row and all
        shares — softly, so audit history survives): a later collection reusing
        the same id starts with a clean slate instead of inheriting the deleted
        one's owner or `public` grant.
      tags: [Documents]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: purge
          in: query
          required: false
          description: >-
            Also delete the physical Qdrant collection, the Elasticsearch index
            and the provenance manifest. Default false (unregister only).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Purged (`purge=true`) — the report lists what was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPurgeReport"
        "204":
          description: >-
            Unregistered (`purge=false`) — the binding is gone and the physical
            stores are intact, still claimed by the other registry entry that
            made this form legal
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: >-
            Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked — ADR-0003 §2)
        "409":
          description: >-
            The legacy shared collection or the current default pointer target;
            with `purge=true`, a collection whose physical store is shared with
            other registry entries (purging would destroy their data); with
            `purge=false`, a collection whose store NO other entry claims
            (unregistering would strand it outside every ACL). The two purge
            cases are mutually exclusive, so one form always succeeds.
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/collections/{collection_id}/restore:
    post:
      operationId: restoreCollection
      summary: Restore a dormant (or lost) collection from its Workspace archive
      description: >-
        Explicit, owner-or-admin counterpart of the on-access restore (#358,
        phase 2 of #353). A collection whose physical stores were evicted is
        `dormant`: only its archive — `versions/<n>/` under the owner's
        Workspace, one directory per completed ingest or delete — still exists.
        This lists those versions and submits the `restore-collection`
        workflow **as the caller** (the caller's bearer token authenticates the
        submission; the engine pre-stages every `ws://` version directory with
        it), which replays them in order into the collection's stores: every
        file's sha256 is verified and the manifest's `spec_hash` must equal the
        registry row's BEFORE anything is written; chunk versions upsert both
        legs with deterministic ids; tombstone versions delete by doc id.


        Idempotent: `dormant` → submits and flips the row to `restoring`;
        `restoring` → 202 without a second submission (the state is a
        compare-and-swap, so concurrent callers cannot double-submit);
        `active` / `archiving` → 202, nothing to do. Unlike the on-access path,
        which answers 409 for a `lost` collection, an explicit restore MAY retry
        from `lost` (the owner may have repaired the archive) — a verification
        failure marks it `lost` again with the reason.


        On completion the row flips `restoring → active`; on an engine failure
        it returns to `dormant` with the error recorded; on a checksum /
        spec-hash failure it becomes `lost` with the reason. Requires a bearer
        (user) credential: an API-key principal carries no Workspace token and
        is refused with 400.
      tags: [Documents]
      security:
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: >-
            Restore submitted, already in flight, or not needed — the body
            reports the resulting state and (when this call submitted it) the
            engine submission id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRestoreResponse"
        "400":
          description: >-
            The caller presented no user (bearer) credential — a restore is
            submitted as the user and needs their token; or the collection's
            registry row records no owner subject, so its Workspace folder
            cannot be located.
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked — ADR-0003 §2)
        "502":
          description: >-
            The Workspace listing or the workflow-engine submission failed; the
            row is left `dormant` (or `lost`) with the reason recorded, so a
            retry is safe.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR restore
            is not configured on this server (no workflow engine); OR the
            tenant is at capacity (#381): the active bound (`max_collections`)
            is met and no active collection can be evicted to make room — the
            same evict-one-then-reserve rule POST /v1/collections applies —
            so nothing is submitted and the row is left as it was; retry
            after `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present for the at-capacity case.
              required: false
              schema:
                type: integer

  /v1/collections/{collection_id}/graph:
    post:
      operationId: extractCollectionGraph
      summary: Extract the knowledge graph of one archived version (owner-or-admin)
      description: >-
        The graph leg of the collection lifecycle (#350, phase 6 of #201).
        Submits the `graph-extract` workflow **as the caller** over ONE
        archived chunk version — the latest by default, or `?version=n` —
        which runs the LLM triple extractor over that version's chunks (one
        call per chunk, bounded concurrency), archives the result beside the
        version as its `triples` leg (`triples.jsonl.gz`; the version's
        `manifest.json` is rewritten with `graph: true` — the one intended
        overwrite of an archived file) and loads the triples into the graph
        store scoped by `(tenant, collection)`. Off by default and never part
        of an ingest: nothing runs until this is called, once per version.


        Budgeted: the collection's graph may hold at most
        `graph_max_triples_per_collection` triples (200,000 by default); a load
        that would cross it is refused whole by the worker — nothing loaded,
        nothing archived — and the job ends `failed` with the error
        `graph_cap_exceeded`. One extraction per owner in flight
        (`graph_extraction_jobs_per_owner`, default 1; admins exempt) — a
        second answers 429 with `Retry-After`. Extractions are tracked as jobs
        of kind `graph` and polled at `GET /v1/ingest/{job_id}` (unchanged
        shape): the job completes only once the engine reports the leg
        DELIVERED to the owner's Workspace, and only then does the registry row
        record the version as graph-archived (eviction's graph drop is gated
        on that, #380).


        Idempotent per version: a version whose leg already exists — the
        registry row says so, or the archived manifest says `graph: true` AND
        the triples file is present at its recorded size (a manifest alone is
        a half-applied delivery: the engine uploads it first, and the next
        call resubmits) — answers 202 with `job_id: null` and submits nothing.
        A collection never has more than one extraction in flight, whoever
        the caller (two deltas post-staged onto one `versions/<n>/` would
        interleave): 429 + `Retry-After`. An LLM outage never becomes an
        empty leg — the extract step exits 1 (retryable) when every attempted
        chunk, or more than `graph_extraction_max_failed_fraction` of them,
        failed its call. Requires a bearer (BV-BRC user) credential — the
        submission is made as the user, and the archive lives in the owner's
        Workspace (an admin's token must be able to read it and write
        `versions/<n>/` there).
      tags: [Documents]
      security:
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: >-
            The archived version number to extract from. Default: the latest
            chunk version (tombstone versions are skipped).
          schema:
            type: integer
            minimum: 0
      responses:
        "202":
          description: >-
            Extraction submitted (`job_id` + the engine `submission_id`), or
            already done for that version (`job_id: null`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphExtractResponse"
        "400":
          description: >-
            The collection's registry row records no owner subject (its
            Workspace archive cannot be located); the archive folder is
            missing or holds no chunk version; or `version` names a version
            that is absent or a tombstone.
        "401":
          description: >-
            Missing or invalid credential — or a credential that is not a
            BV-BRC user (bearer) token: an API-key or keyless caller cannot
            submit as the user.
        "403":
          description: >-
            Caller can read the collection but is neither its owner nor an
            admin; or the caller's token cannot read the owner's Workspace
            archive.
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked — ADR-0003 §2)
        "409":
          description: >-
            The collection has no registry row (the settings-derived default),
            or is not `active`/`archiving` (dormant, restoring or lost — restore
            it first: the graph is loaded into a live collection's scope).
        "429":
          description: >-
            An extraction of this collection is already in flight (a job of
            kind `graph` that is `accepted`/`running` and written to within
            the last 6 h — whoever started it, admins included), or the caller
            already has `graph_extraction_jobs_per_owner` extraction(s) in
            flight (admins exempt from this one). Retry after `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
        "502":
          description: >-
            The Workspace listing / manifest read or the workflow-engine
            submission failed; the job (when one was minted) is `failed` with
            the error class as its label, so a retry is safe.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR graph
            extraction is not configured on this server (no workflow engine,
            or the workflow file is unreadable).

  /v1/collections/{collection_id}/shares:
    get:
      operationId: listCollectionShares
      summary: List a collection's shares (owner-or-admin)
      description: >-
        Enumerate the active shares of a collection: who it is shared with
        (`grantee_type` + `grantee_id`), at what `permission`, by whom and when.
        Owner-or-admin only — a non-owner must not learn who a private collection
        is shared with, so the same seam and leak-safe status mapping as
        `DELETE /v1/collections` applies (403 for a readable non-owned
        collection, 404 for an unknown/unreadable one). The response also reports
        the current `owner`. Pass `include_revoked=true` for the full audit
        history (revoked rows carry `revoked_by`/`revoked_at` and `active:false`).
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: include_revoked
          in: query
          required: false
          description: Include soft-revoked rows (audit history). Default false (active only).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The collection's shares and its current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharesResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked)
        "503":
          description: Authorization store unavailable — refused (fail closed).
    post:
      operationId: grantCollectionShare
      summary: Grant a share on a collection (owner-or-admin)
      description: >-
        Share a collection with a user or with everyone. v1 is read-only and
        owner-or-admin. `permission` accepts `read` only: `owner` is rejected
        (ownership is transferred, not granted) and `write` is deferred.


        The `grantee` is resolved server-side: the literal `@public` (or `public`)
        maps to the built-in world-readable **public group** (read-only —
        making a collection public is `GRANT read TO public`, and un-publishing is
        `DELETE` of that share); a value containing `:` is taken as a full
        `issuer:subject` string and stored verbatim; the form
        `@service:<subject>` names a **service account** and keeps its subject
        colon-free; and a bare BV-BRC username is prefixed to `bvbrc:<username>`.
        The resolved subject is echoed back in the response so a typo is visible
        — a typo'd grantee is otherwise an unclaimable grant. `@service:` is
        REQUIRED for a machine identity: a bare subject would be qualified with
        the default issuer, creating a grant for a federated identity the service
        account can never authenticate as. There is no BV-BRC username-existence check; sharing
        with a user who has never logged in pre-provisions their row so the grant
        is claimed on their first login. `grant_option` is not exposed (false).
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareGrantRequest"
      responses:
        "201":
          description: The share was granted; the resolved row is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRecord"
        "400":
          description: A `permission` of `owner` was requested (transfer, not grant)
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked)
        "409":
          description: >-
            The grant violates an invariant — a duplicate active grant, a
            no-op grant to the current owner, a public write, or an unknown
            grantee vocabulary
        "413":
          description: The JSON request body exceeds max_json_body_bytes (default 1 MB).
        "422":
          description: >-
            An empty grantee, a bare username with a blank issuer, an unknown
            group id (`@group:<id>` that does not exist), or a non-read permission
        "429":
          description: >-
            Rate limit exceeded (issue #87): more than
            rate_limit_shares_per_hour requests from this principal in the last
            hour. An admin principal is exempt from this bucket (but not from
            the request bounds). Retry after the delay named in the
            `Retry-After` header (seconds).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/collections/{collection_id}/shares/{share_id}:
    delete:
      operationId: revokeCollectionShare
      summary: Revoke a share (owner-or-admin)
      description: >-
        Soft-revoke a share (never deleted; audit history survives). Revocation
        cascades along the `granted_by` chain per ADR-0004 decision 5, so
        revoking a grantor also revokes what they granted onward. Un-publishing a
        collection is just revoking its `public` share.


        Owner-or-admin, gated through the same seam as the other share endpoints.
        The `share_id` must belong to `{collection_id}` — the store looks a share
        up by id alone, so a `share_id` from another collection (or an unknown id)
        is a 404, never a cross-collection revoke. The active **owner** row is not
        revocable here (that would strip ownership — delete the collection or
        transfer ownership instead): 409. Returns 204 with no body.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: share_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The share (and any cascade) was revoked
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection, unknown share, or a share that does not belong to
            this collection (existence not leaked)
        "409":
          description: The referenced share is the active owner row (not revocable here)
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/collections/{collection_id}/owner:
    post:
      operationId: transferCollectionOwner
      summary: Transfer ownership of a collection (owner-or-admin)
      description: >-
        Hand a collection to another user. This is the flow
        `POST /v1/collections/{id}/shares` refuses `permission: owner` in favour
        of: there is exactly ONE active owner row per collection (a partial unique
        index enforces it), so a handover is an atomic revoke+grant *pair*, not an
        extra share. Current-owner-or-admin, gated through the same seam as the
        share endpoints.


        `POST`, not `PATCH`: there is no owner *document* to merge a partial
        representation into. This is a state transition with audit side effects —
        one row soft-revoked, one row appended — and it is not idempotent
        (replaying it is a 409, not a no-op).


        **The outgoing owner loses access** unless something else grants it back.
        Their owner row is soft-revoked, never deleted (ADR-0004 decision 6 — the
        handover stays in the audit trail), and NO consolation `read` grant is
        minted: that would be a second write outside the transfer's transaction,
        and an invented grant nobody asked for would still be active for the new
        owner to discover. Re-granting is one explicit call to the shares
        endpoint. So it is not silent either way, the response reports
        `previous_owner`, the `revoked_share_id` of their revoked row, and
        `previous_owner_retains_read` (re-evaluated through the authorization
        seam, so it accounts for an independent share, group membership or a
        `public` grant).


        The transfer is deliberately NON-cascading: every other share on the
        collection survives untouched. `subject` resolves with the same rules as a
        share `grantee`, except that the group forms (`@public`, `@group:<id>`)
        are rejected — ownership is grantable to users only. A subject that has
        never authenticated is pre-provisioned, exactly as a share grantee is —
        for an ADMIN actor. A non-admin actor naming a subject who has never
        signed in (and is not a registered service account) is refused with
        422 instead (issue #290): unlike a share, ownership feeds the per-owner
        quota, and a never-seen recipient's owned count is always 0.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerTransferRequest"
      responses:
        "200":
          description: Ownership transferred; the new owner row and the outgoing owner's fate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerTransferResponse"
        "400":
          description: >-
            The subject resolves to a group (`@public` / `@group:<id>`) —
            ownership is grantable to users only, never to a group
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller can read the collection but is neither its owner nor an admin
        "404":
          description: >-
            Unknown collection id, or one the caller may not read (unreadable ==
            unknown, so existence is not leaked)
        "409":
          description: >-
            The subject already owns the collection (a handover that never
            happened must not churn the audit trail), the collection has no
            active owner row to transfer from, or the incoming subject already
            owns `max_collections_per_owner` collections (default 5, issue
            #290) — a structured `{owned, limit}` detail, checked atomically
            with the revoke+grant pair; the current owner keeps the collection.
            This is what blocks both the create-at-limit/transfer-away/
            create-again evasion and transferring junk onto a colleague to
            fill their quota. The RECIPIENT is exempt from this check when
            THEY are an admin (logged) — not the acting principal: an
            admin-initiated transfer to a full non-admin colleague still 409s,
            so this endpoint can't be used as a backdoor around that
            colleague's own quota.
        "422":
          description: >-
            A malformed subject — empty/whitespace, a degenerate `issuer:subject`
            half, a bare username with a blank issuer, or a reserved/colon-bearing
            `@service:` subject; or (issue #290, non-admin actor only) a
            recipient who has never signed in and is not a registered service
            account, refused before any row is minted for them — an admin
            actor is exempt (logged), since handing a collection to a
            successor who has not signed in yet is a legitimate admin action
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/groups:
    get:
      operationId: listGroups
      summary: List the groups the caller owns or belongs to
      description: >-
        The active groups the caller owns (`owner_subject` == the caller) or is
        an active member of. The implicit built-in `public` group is not listed
        (its membership is "everyone" and constant-true). Any authenticated
        caller; a store outage is 503 (fail closed).
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: The groups the caller owns or belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "503":
          description: Authorization store unavailable — refused (fail closed).
    post:
      operationId: createGroup
      summary: Create a group (any authenticated caller)
      description: >-
        Create an active group owned by the caller. The `name` is non-empty,
        unique per owner among active groups, and may not be the reserved
        literal `public`. The caller becomes `owner_subject` and may add/remove
        members and delete the group.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
      responses:
        "201":
          description: The group was created; the resolved row is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRecord"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "409":
          description: >-
            An active group with that name already exists for this owner, or the
            reserved `public` name was requested
        "422":
          description: An empty or whitespace name
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/groups/{group_id}:
    get:
      operationId: getGroup
      summary: Group details and members (owner-or-member)
      description: >-
        The group and its active membership. Owner, an active member, or an
        admin may view it; anyone else gets a leak-safe 404 (a group's existence
        and membership never leak to a non-member). The built-in `public` group
        is viewable and returns an empty members list.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The group and its active members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetailResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "404":
          description: >-
            Unknown group id, or one the caller may not view (a non-member —
            existence is not leaked)
        "503":
          description: Authorization store unavailable — refused (fail closed).
    delete:
      operationId: deleteGroup
      summary: Delete a group (owner-or-admin)
      description: >-
        Soft-delete a group (audit history survives). Owner-or-admin only; a
        member who is not the owner gets 403, a non-member gets a leak-safe 404.
        The built-in `public` group is not deletable (409). The group's member
        rows and any shares granted to it are left intact for audit but become
        inert immediately — a share to a deleted group grants nothing. Returns
        204 with no body.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The group was soft-deleted
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller is an active member but is neither the owner nor an admin
        "404":
          description: Unknown group, or one the caller may not view (existence not leaked)
        "409":
          description: The group is the reserved built-in `public` group (not deletable)
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/groups/{group_id}/members:
    post:
      operationId: addGroupMember
      summary: Add a member to a group (owner-or-admin)
      description: >-
        Add a user to the group. Owner-or-admin only (a non-owner member gets
        403, a non-member 404). The `subject` is resolved server-side like a
        share grantee: a value containing `:` is a full `issuer:subject` kept
        verbatim, `@service:<subject>` names a service account (kept colon-free),
        and a bare BV-BRC username is prefixed to `bvbrc:<username>`; the
        resolved subject is echoed back so a typo is visible. A never-logged-in
        user is pre-provisioned so the membership is claimed on first login.
        Membership is a flat list of users — a group id cannot be a member (no
        nesting, 422/409). Adding to the built-in `public` group is refused
        (409). A duplicate active membership is a 409.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberAddRequest"
      responses:
        "201":
          description: The member was added; the resolved membership row is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberRecord"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller is an active member but is neither the owner nor an admin
        "404":
          description: Unknown group, or one the caller may not view (existence not leaked)
        "409":
          description: >-
            A duplicate active membership, or the built-in `public` group
            (not member-editable)
        "422":
          description: An empty subject, a group-target form, or a bare username with a blank issuer
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/groups/{group_id}/members/{subject}:
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group (owner-or-admin)
      description: >-
        Soft-remove a member (audit history survives). Owner-or-admin only (a
        non-owner member gets 403, a non-member 404). The removal is an instant
        access change: any collection shared to the group is no longer readable
        by the removed user on the next request. `subject` is resolved the SAME
        way as on add — a bare username is qualified to `issuer:sub` (using the
        `issuer` query, default `bvbrc`) so removing with the identifier used to
        add reliably matches; a full `issuer:sub` string and an
        `@service:<subject>` form are taken verbatim. A
        group-target form (`@public` / `@group:`) is rejected (422). Removing a
        non-member is a 204 no-op. Returns 204 with no body.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
        - name: subject
          in: path
          required: true
          description: >-
            The member subject to remove. A full `issuer:sub` string is taken
            verbatim; a bare username is qualified to `issuer:sub` using the
            `issuer` query — exactly as on add.
          schema:
            type: string
        - name: issuer
          in: query
          required: false
          description: >-
            Issuer used to qualify a bare `subject` (default `bvbrc`). Ignored
            when `subject` is already a full `issuer:sub` string.
          schema:
            type: string
            default: bvbrc
      responses:
        "204":
          description: The member was removed (or was not a member — idempotent)
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Caller is an active member but is neither the owner nor an admin
        "404":
          description: Unknown group, or one the caller may not view (existence not leaked)
        "422":
          description: A group-target form (`@public` / `@group:`) — members are users, no nesting
        "503":
          description: Authorization store unavailable — refused (fail closed).

  /v1/models/available:
    get:
      operationId: listAvailableModels
      summary: Registered models assignable per-request (llm / reranker)
      description: >-
        Models registered for a hot-swappable task, for the Compare per-lane
        `llm` / `reranker` pickers. Any authenticated caller; `base_urls` are not
        exposed (registration is admin-only + SSRF-checked).
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Assignable models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableModelsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)

  /v1/chunks:
    get:
      operationId: getChunks
      summary: Fetch chunks by id (context expansion)
      description: >-
        Fetch chunks by id from a collection's vector store, tenant-scoped (own +
        `public`). `ids` is a comma-separated list — typically the
        `prev_chunk_id` / `next_chunk_id` carried in a Source's metadata — so a
        client can expand a retrieved chunk's neighbouring context. Unknown or
        out-of-scope ids are silently omitted; order follows the request. More
        than `max_chunk_ids` (default 200, issue #87) entries is a 422, not a
        silent truncation.
      tags: [Query]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: ids
          in: query
          required: false
          description: Comma-separated chunk ids (at most max_chunk_ids, default 200).
          schema: { type: string }
        - name: collection
          in: query
          required: false
          description: >-
            Registry collection to read from. Omitted targets **this caller's**
            default — the same id `GET /v1/collections` reports as `default`
            (registry default when readable, else the caller's first readable
            collection). A caller with no readable collection gets 404 `no
            collection is accessible to this caller`. An **explicitly named** id
            that is unknown *or* unreadable is a 404 that does not distinguish
            the two.
          schema: { type: string }
      responses:
        "200":
          description: The requested chunks that exist and are visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunksResponse"
        "400":
          description: >-
            The resolved store rejected the scope filters it was asked to apply
            (an unsupported filter key — refused rather than silently ignored, #197).
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "404":
          description: Unknown collection, or one the caller may not read (read denial → 404).
        "422":
          description: More than max_chunk_ids entries in `ids` (default 200, issue #87).
        "409":
          description: >-
            The collection is `lost` (#358): its Workspace archive is missing or
            failed verification (sha256 / build-spec hash), so it cannot be
            restored automatically. The body names the reason; after repairing
            the archive the owner retries with
            POST /v1/collections/{collection_id}/restore.
        "503":
          description: >-
            Authorization store unavailable — refused (fail closed); OR the
            collection is `dormant` / `restoring` (#358): the first
            authenticated read or ingest of a dormant collection submits a
            restore from its Workspace archive (as the caller, with the caller's
            token) and answers 503 while the restore runs — retry after the
            delay named in `Retry-After` (seconds). A keyless / API-key caller
            carries no user token, cannot trigger the restore, and gets 503
            with a message saying so. A second cause on a dormant collection
            (#381): the tenant is at capacity — the active bound
            (`max_collections`) is met and no active collection can be evicted
            to make room — so the restore is NOT submitted, the row stays
            `dormant`, and the message names the reason; retry after
            `Retry-After`.
          headers:
            Retry-After:
              description: >-
                Seconds to wait before retrying. Present for the lifecycle
                (dormant / restoring / at capacity) case.
              required: false
              schema:
                type: integer

  /v1/graph/stats:
    get:
      operationId: graphStats
      summary: Knowledge-graph entity/relationship counts (tenant-scoped)
      description: >-
        Entity and relationship counts scoped to the caller's readable tenants
        (own + `public`). Degrades to `available: false` with null counts when
        no graph store is configured.
      tags: [Graph]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Tenant-scoped graph counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphStatsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)

  /v1/health/deep:
    get:
      operationId: healthDeep
      summary: Deep dependency health probe (admin only)
      description: >-
        Liveness of each backing store (vector, text, graph, job store) with
        per-check latency and backend detail. ADMIN ONLY — the `detail` strings
        can carry backend hostnames/versions, so a non-admin gets 403.
      tags: [Health]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Per-dependency health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Authenticated but insufficient role (admin required)

  /v1/jobs:
    get:
      operationId: listJobs
      summary: Recent ingest jobs (admin only)
      description: >-
        Recent ingest jobs for the Ops dashboard, most-recent-activity first.
        ADMIN ONLY — a job's `source` can carry a filesystem path, so a non-admin
        gets 403.
      tags: [Jobs]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Recent ingest jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Authenticated but insufficient role (admin required)

  /v1/stats/models:
    get:
      operationId: statsModels
      summary: Model endpoint status (admin only)
      description: >-
        Per-role (embedding / llm / reranker) model status with per-endpoint
        reachability, latency, and pool health. ADMIN ONLY — `url`/`detail` can
        carry backend hostnames, so a non-admin gets 403.
      tags: [Stats]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      responses:
        "200":
          description: Per-model endpoint status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsStatusResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Authenticated but insufficient role (admin required)

  /v1/stats/models/benchmark:
    post:
      operationId: benchmarkModels
      summary: Short embedding/LLM throughput benchmark (admin only)
      description: >-
        Runs a small, bounded embedding + LLM throughput probe and returns
        per-model timings. ADMIN ONLY. The request bounds keep it from being
        coaxed into a load test.
      tags: [Stats]
      security:
        - ApiKeyAuth: []
        - BearerIdentity: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRequest"
      responses:
        "200":
          description: Per-model benchmark result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkResponse"
        "401":
          description: Missing or invalid credential (API key or bearer identity)
        "403":
          description: Authenticated but insufficient role (admin required)

components:
  headers:
    XRequestId:
      description: >-
        The server-generated correlation id for this request (16 lowercase hex
        characters). It is on every log line the request produced, so a user who
        reports a failure — or pastes a screenshot — gives an operator a single
        `grep rid=<id>` to find it. Present on EVERY response of every
        operation, success and error alike; the operations below reference this
        definition only where the conformance suite asserts it, to keep the
        document readable.


        The id is always generated by the server and never taken from the
        request. An inbound `X-Request-ID` is not echoed: it is recorded
        alongside the server's own id (as `upstream_rid` on the log line) when
        it matches `^[A-Za-z0-9._-]{1,64}$`, and dropped otherwise. That keeps
        this id unique and un-forgeable, and keeps a newline in a
        caller-supplied header out of the log.


        One documented gap: a bare 500 generated by Starlette's
        `ServerErrorMiddleware` after an unhandled exception escapes the
        application is emitted above every middleware this application installs.
        That path is stamped by an application-level `Exception` handler
        instead; the log line for it always carries the id regardless.
      required: false
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Per-caller key mapped server-side to a tenant (data isolation) and an
        RBAC role (admin | user; `researcher` is accepted as a deprecated alias
        for `user`). Roles are enforced
        per-endpoint server-side; some routes (e.g. /v1/config, /v1/admin/*)
        require the admin role and return 403 otherwise.


        Every authenticated route accepts EITHER scheme (never both in one
        request — that is a 400). Admin-only routes are no exception: the role
        gate tests the authenticated principal's role, not which credential
        produced it, so a bearer identity named by an admin source reaches all
        of `/v1/admin/*`. An `admin`-gated operation therefore lists both
        schemes and its 401 means "no usable credential", of either kind.
    BearerIdentity:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        End-user identity credential, verified server-side by the configured
        identity provider (`IDENTITY_PROVIDER=bvbrc|oidc`; `none`, the default,
        disables this scheme entirely and the header is ignored). The canonical
        form is `Authorization: Bearer <credential>`; the `Bearer ` prefix is
        optional because the BV-BRC token wire format carries no scheme.


        The authenticated subject always comes from the provider — a BV-BRC
        token's `un=` is read only after its RSA signature verifies against a
        public key from a **pinned** issuer allowlist, and an OIDC ID token's
        `sub` only after RS256 verification against the issuer's JWKS with `iss`
        and `aud` pinned. The caller's tenant is `{issuer}:{subject}` and the
        role is `user` **unless an explicit server-side admin source names this
        subject** — never the deployment's default role.


        The only two admin sources are server-side and unreachable by the
        caller: the `ADMIN_SUBJECTS` environment allowlist (colon-bearing
        `issuer:subject` entries, checked first, with no store read — the
        break-glass path that works on an empty users table and survives a
        store outage), and a `users.role` of `admin` written by an existing
        admin through `PATCH /v1/admin/users/{subject}/role`. Nothing in the
        credential itself — no claim, no header — is an input to the role
        decision, so a token can never self-elevate. If the store cannot be
        read, the role resolves to `user` (elevation fails CLOSED); the
        request still authenticates.


        Presenting this header together with `X-API-Key` is a **400**: which
        credential authenticated the request must never be ambiguous. A provider
        that cannot be reached is a **503**, never a 401 and never an allow.
  schemas:
    ConfigResponse:
      type: object
      description: Allowlisted operational config — no secrets are ever included.
      required:
        - vector_backend
        - text_backend
        - graph_backend
        - job_store_backend
        - require_durable_backends
        - qdrant_url
        - qdrant_collection
        - qdrant_collection_explicit
        - elasticsearch_url
        - elasticsearch_index
        - neo4j_uri
        - embedding_api
        - embedding_model
        - embedding_model_dim
        - embedding_endpoints
        - embedding_max_concurrency
        - chunk_method
        - chunk_size
        - chunk_overlap
        - chunk_max_tokens
        - chunk_token_counter
        - top_k
        - rerank_enabled
        - rerank_candidates
        - reranker_model
        - crossencoder_sidecar_url
        - kg_extraction_enabled
        - ingest_concurrency
        - ingest_shard_size
        - tenant_max_concurrency
        - max_document_bytes
        - max_chunks_per_collection
        - max_upload_files
        - max_upload_bytes_per_request
        - upload_content_types
        - allow_user_collection_create
        - log_level
      properties:
        vector_backend: { type: string }
        text_backend: { type: string }
        graph_backend: { type: string }
        job_store_backend: { type: string }
        require_durable_backends: { type: boolean }
        qdrant_url: { type: string }
        qdrant_collection: { type: string }
        qdrant_collection_explicit: { type: string }
        elasticsearch_url: { type: string }
        elasticsearch_index: { type: string }
        neo4j_uri: { type: string }
        embedding_api: { type: string }
        embedding_model: { type: string }
        embedding_model_dim: { type: integer }
        embedding_endpoints:
          type: array
          items: { type: string }
        embedding_max_concurrency: { type: integer }
        chunk_method: { type: string }
        chunk_size: { type: integer }
        chunk_overlap: { type: integer }
        chunk_max_tokens: { type: [integer, "null"] }
        chunk_token_counter: { type: string }
        top_k: { type: integer }
        rerank_enabled: { type: boolean }
        rerank_candidates: { type: integer }
        reranker_model: { type: string }
        crossencoder_sidecar_url: { type: string }
        kg_extraction_enabled: { type: boolean }
        ingest_concurrency: { type: integer }
        ingest_shard_size: { type: integer }
        tenant_max_concurrency: { type: integer }
        max_document_bytes: { type: integer }
        max_chunks_per_collection: { type: integer }
        max_upload_files: { type: integer }
        max_upload_bytes_per_request: { type: integer }
        upload_content_types:
          type: array
          items: { type: string }
        allow_user_collection_create: { type: boolean }
        log_level: { type: string }
      additionalProperties: false

    StoreCount:
      type: object
      description: A single store's tenant-scoped count.
      required: [backend, available, count]
      properties:
        backend: { type: string }
        available: { type: boolean }
        count:
          type: [integer, "null"]
          description: Tenant-FILTERED count; null when the store is unavailable.
      additionalProperties: false

    StoreStatsResponse:
      type: object
      description: Per-store counts scoped to the caller's readable tenants.
      required: [tenants, vector, text, graph]
      properties:
        tenants:
          type: array
          items: { type: string }
          description: The caller's base readable tenants (own + public). Per-collection share widening can add to the scope a count actually used, so this is the base, not the exhaustive list.
        vector: { $ref: "#/components/schemas/StoreCount" }
        text: { $ref: "#/components/schemas/StoreCount" }
        graph: { $ref: "#/components/schemas/StoreCount" }
      additionalProperties: false

    TenantCollectionCount:
      type: object
      description: One (tenant, collection) cell of the breakdown.
      required: [collection, label]
      properties:
        collection: { type: string }
        label: { type: string }
        vector_count: { type: [integer, "null"] }
        text_count: { type: [integer, "null"] }
      additionalProperties: false

    TenantRow:
      type: object
      required: [tenant, own, collections]
      properties:
        tenant: { type: string }
        own:
          type: boolean
          description: The caller's own tenant, vs the shared public corpus it may also read.
        collections:
          type: array
          items: { $ref: "#/components/schemas/TenantCollectionCount" }
      additionalProperties: false

    TenantsResponse:
      type: object
      description: Who the caller is, what it may reach, and where its readable data lives.
      required: [tenant, role, readable, auth_enabled, tenants]
      properties:
        tenant: { type: string }
        role: { type: string }
        readable:
          type: array
          items: { type: string }
          description: Own + public — the tenants every read is filtered to.
        restricted_to:
          type: [array, "null"]
          items: { type: string }
          description: Collection allowlist for this tenant; null = unrestricted.
        auth_enabled:
          type: boolean
          description: >-
            False on the keyless dev/test path, where every caller is the default
            tenant. Production startup forbids it.
        policy:
          type: [object, "null"]
          description: >-
            Admin only: the full tenant -> collections map (TENANT_COLLECTIONS).
            Null for non-admins, since it names other tenants.
          additionalProperties:
            type: array
            items: { type: string }
        tenants:
          type: array
          items: { $ref: "#/components/schemas/TenantRow" }
      additionalProperties: false

    GraphStatsResponse:
      type: object
      description: Knowledge-graph counts scoped to readable tenants.
      required: [backend, available, entities, relationships]
      properties:
        backend: { type: string }
        available: { type: boolean }
        entities: { type: [integer, "null"] }
        relationships: { type: [integer, "null"] }
      additionalProperties: false

    DeepHealthResponse:
      type: object
      description: >-
        Deep dependency health (admin only — detail may carry backend info).
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
              latency_ms: { type: [number, "null"] }
            additionalProperties: false
      additionalProperties: false

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        rewrite_strategies:
          type: array
          items:
            type: string
          default: ["passthrough"]
        filters:
          type: object
          default: {}
        use_graph:
          type: boolean
          default: true
        stream:
          type: boolean
          default: false
        rerank:
          description: >-
            Per-request rerank control. null (default) preserves the
            server-wide default (rerank iff a reranker is configured); false
            forces a rerank skip; true is a no-op when no reranker is wired.
          type: [boolean, "null"]
          default: null
        rerank_candidates:
          description: >-
            Override for the candidate-pool depth fed to the reranker. null
            (default) uses the server default (max(top_k, server's
            rerank_candidates)).
          type: [integer, "null"]
          minimum: 1
          default: null
        collection:
          description: >-
            Registry collection id to query. null (default) targets **this
            caller's** default — the same id `GET /v1/collections` reports as
            `default` (registry default when readable, else the caller's first
            readable collection). A caller with no readable collection gets 404
            `no collection is accessible to this caller`. An **explicitly
            named** id that is unknown *or* unreadable is a 404 that does not
            distinguish the two. See GET /v1/collections.
          type: [string, "null"]
          default: null
        collections:
          description: >-
            Multi-collection fused retrieval (issue #253): registry collection
            ids to query together. Every id is resolved and read-authorized
            BEFORE any retrieval runs (an unknown or unreadable id is a 404 for
            the whole request — no partial answers; a dormant member is a 503 +
            Retry-After for the whole request); then one single-collection
            retrieval leg runs per id, concurrently, the legs are fused with
            RRF, reranked once over the union and cut to top_k. Each returned
            Source carries the member it came from in `collection`; a document
            present in two collections appears once per collection. Mutually
            exclusive with `collection` (both → 422). 1 to 5 unique ids (more,
            duplicates, or an empty list → 422); a single id behaves exactly
            like `collection`. Never expressed as one many-valued store filter
            — one leg per collection.
          type: [array, "null"]
          items:
            type: string
          minItems: 1
          maxItems: 5
          uniqueItems: true
          default: null
        retrieval_mode:
          description: >-
            Retrieval legs: hybrid (dense + BM25, RRF-fused), vector (dense only),
            or bm25 (sparse only). The graph leg is orthogonal (use_graph).
          type: string
          enum: [hybrid, vector, bm25]
          default: hybrid
        context_window:
          description: >-
            Server-side context expansion (issue #322): after fusion, rerank and
            the top_k cut, walk each returned source's prev_chunk_id /
            next_chunk_id up to this many hops each way and attach the
            neighbours as the Source's context (ranking unchanged; never merged
            into the scored list). Scoped by the same filters and tenant scope
            as the retrieval; a neighbour the caller may not read is omitted; a
            neighbour that is itself a returned source is not duplicated.
            0 (default) leaves the response as before. Above 3 is a 422.
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        llm:
          description: >-
            Registered model id to generate the answer with for THIS request only
            (global assignment untouched; retrieval unchanged). Unknown id 404;
            non-llm model 400. See GET /v1/models/available.
          type: [string, "null"]
          default: null
        reranker:
          description: >-
            Registered model id to rerank with for THIS request only. Unknown id
            404; non-reranker model 400. See GET /v1/models/available.
          type: [string, "null"]
          default: null

    QueryResponse:
      type: object
      required: [answer, sources, rewritten_queries]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        rewritten_queries:
          type: array
          items:
            type: string

    RetrieveRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        filters:
          type: object
          default: {}
        use_graph:
          type: boolean
          default: true
        rerank:
          description: >-
            Per-request rerank control. null (default) preserves the
            server-wide default (rerank iff a reranker is configured); false
            forces a rerank skip; true is a no-op when no reranker is wired.
          type: [boolean, "null"]
          default: null
        rerank_candidates:
          description: >-
            Override for the candidate-pool depth fed to the reranker. null
            (default) uses the server default (max(top_k, server's
            rerank_candidates)).
          type: [integer, "null"]
          minimum: 1
          default: null
        collection:
          description: >-
            Registry collection id to retrieve from. null (default) targets
            **this caller's** default — the same id `GET /v1/collections`
            reports as `default` (registry default when readable, else the
            caller's first readable collection). A caller with no readable
            collection gets 404 `no collection is accessible to this caller`. An
            **explicitly named** id that is unknown *or* unreadable is a 404
            that does not distinguish the two. See GET /v1/collections.
          type: [string, "null"]
          default: null
        collections:
          description: >-
            Multi-collection fused retrieval (issue #253): registry collection
            ids to retrieve from together. Every id is resolved and read-authorized
            BEFORE any retrieval runs (an unknown or unreadable id is a 404 for
            the whole request — no partial answers; a dormant member is a 503 +
            Retry-After for the whole request); then one single-collection
            retrieval leg runs per id, concurrently, the legs are fused with
            RRF, reranked once over the union and cut to top_k. Each returned
            Source carries the member it came from in `collection`; a document
            present in two collections appears once per collection. Mutually
            exclusive with `collection` (both → 422). 1 to 5 unique ids (more,
            duplicates, or an empty list → 422); a single id behaves exactly
            like `collection`. Never expressed as one many-valued store filter
            — one leg per collection.
          type: [array, "null"]
          items:
            type: string
          minItems: 1
          maxItems: 5
          uniqueItems: true
          default: null
        retrieval_mode:
          description: >-
            Retrieval legs: hybrid | vector | bm25 (see QueryRequest).
          type: string
          enum: [hybrid, vector, bm25]
          default: hybrid
        context_window:
          description: >-
            Server-side context expansion (issue #322): after fusion, rerank and
            the top_k cut, walk each returned source's prev_chunk_id /
            next_chunk_id up to this many hops each way and attach the
            neighbours as the Source's context (ranking unchanged; never merged
            into the scored list). Scoped by the same filters and tenant scope
            as the retrieval; a neighbour the caller may not read is omitted; a
            neighbour that is itself a returned source is not duplicated.
            0 (default) leaves the response as before. Above 3 is a 422.
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        reranker:
          description: >-
            Registered model id to rerank with for THIS request only. Unknown id
            404; non-reranker model 400. See GET /v1/models/available.
          type: [string, "null"]
          default: null

    RetrieveResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    CollectionInfo:
      type: object
      required: [id, label, model, dim, default]
      properties:
        id: { type: string }
        label: { type: string }
        model: { type: string }
        dim: { type: integer }
        chunk_method: { type: [string, "null"] }
        chunk_size: { type: [integer, "null"] }
        default:
          description: >-
            Deprecated alias of `is_default` (the global registry-pointer flag).
            New clients read `is_default`; this is NOT the caller's effective
            target — see `CollectionsResponse.default`.
          type: boolean
          deprecated: true
        is_default:
          description: >-
            True on at most one listed entry: the collection the registry
            pointer (`default`, DEFAULT_COLLECTION_ID) names. `default` is a
            pointer, never a registry entry of its own (ADR-0002 decision 5);
            this flag says which real entry it names. This is the canonical
            long-term field — the older `default` (same value) collides in name
            with `CollectionsResponse.default`, which is the id string; clients
            should read `is_default`. Optional so older servers stay
            conformant. Zero listed entries carry it when the caller cannot read
            the collection the pointer names — in that case
            `CollectionsResponse.default` names a different, readable
            collection, or is the empty string when the caller can read none at
            all.
          type: boolean
        state:
          description: >-
            Lifecycle state (#353/#358): active | archiving | dormant (only the
            Workspace archive exists; the next authenticated read/ingest
            triggers a restore and answers 503 + Retry-After) | restoring |
            lost (archive missing or failed verification; 409 until an explicit
            restore succeeds). Null/absent for an untracked collection (the
            settings-derived default).
          type: [string, "null"]
          enum: [active, archiving, dormant, restoring, lost, null]
        archive_pending:
          description: >-
            True when the last ingest/delete loaded but its archive step or
            upload failed — the collection stays active, cannot be evicted, and
            the owner's next authenticated call re-triggers the archive.
          type: [boolean, "null"]
        versions:
          description: >-
            Ordered archive version numbers on the registry row (`versions/<n>/`
            in the owner's Workspace); a restore replays them in this order.
          type: [array, "null"]
          items: { type: integer }
        count:
          description: Vector-store count scoped to what this caller can retrieve (own + public, widened by a read share); null when unavailable.
          type: [integer, "null"]
        text_count:
          description: Text-index (BM25) tenant-scoped count; compare with `count` for a vector↔text parity check. Null when unavailable.
          type: [integer, "null"]
        provenance:
          description: Verified build lineage from the collection's manifest; null when none.
          type: [object, "null"]
          additionalProperties: false
          properties:
            chunk_method: { type: [string, "null"] }
            chunk_size: { type: [integer, "null"] }
            chunk_overlap: { type: [integer, "null"] }
            chunk_params: { type: object }
            spec_hash: { type: string }
            corpus: { type: string }
            chunk_count: { type: [integer, "null"] }
            ingested_at: { type: string }
            source: { type: string }
      additionalProperties: false

    CollectionPurgeReport:
      type: object
      description: >-
        What `DELETE /v1/collections/{id}?purge=true` actually destroyed. Four
        independent systems are touched (registry, Qdrant, Elasticsearch, the
        manifest file) and each can succeed, be already-gone, or fail on its own —
        so the outcome is three lists, not a boolean. Targets are `registry`,
        `vectors`, `text_index`, `manifest`.
      required: [collection_id, purged, store, text_index, deleted, absent, failed, ok]
      properties:
        collection_id:
          description: The registry id that was purged.
          type: string
        purged:
          description: True — a `purge=false` delete returns 204 with no body instead.
          type: boolean
        store:
          description: Physical Qdrant collection name the purge targeted.
          type: string
        text_index:
          description: Physical Elasticsearch index name the purge targeted.
          type: string
        deleted:
          description: Targets that were actually removed.
          type: array
          items: { type: string }
        absent:
          description: Targets that were already gone (idempotent no-op, not an error).
          type: array
          items: { type: string }
        failed:
          description: >-
            Targets that errored. NOT rolled back — the physical resource may
            still exist and needs cleaning up by hand.
          type: array
          items:
            type: object
            required: [target, error]
            properties:
              target: { type: string }
              error: { type: string }
            additionalProperties: false
        ok:
          description: True when `failed` is empty — the collection and its data are fully gone.
          type: boolean
      additionalProperties: false

    CollectionRestoreResponse:
      type: object
      description: >-
        Outcome of POST /v1/collections/{id}/restore (#358): the collection's
        lifecycle state after the call. 202 in every accepted case — a restore
        was submitted, one was already in flight, or none was needed.
      required: [collection_id, state, message]
      properties:
        collection_id: { type: string }
        state:
          description: >-
            State after this call: `restoring` when a restore is in flight
            (submitted now or earlier), `active`/`archiving` when nothing had to
            be done.
          type: string
          enum: [active, archiving, dormant, restoring, lost]
        submission_id:
          description: >-
            The workflow-engine submission id when THIS call submitted the
            restore; null when one was already in flight or none was needed.
          type: [string, "null"]
        message: { type: string }
      additionalProperties: false

    GraphExtractResponse:
      type: object
      description: >-
        Outcome of POST /v1/collections/{id}/graph (#350): which archived
        version the graph is extracted from and the job to poll. 202 in every
        accepted case — an extraction was submitted, or the version's graph leg
        already existed (`job_id: null`).
      required: [collection_id, version, message]
      properties:
        collection_id: { type: string }
        version:
          description: The archived version the extraction reads (or already covers).
          type: integer
          minimum: 0
        job_id:
          description: >-
            The job to poll at GET /v1/ingest/{job_id} (kind `graph`); null
            when the version already had its graph leg and nothing was
            submitted.
          type: [string, "null"]
        submission_id:
          description: >-
            The workflow-engine submission id when THIS call submitted the
            extraction; null otherwise.
          type: [string, "null"]
        message: { type: string }
      additionalProperties: false

    EvictionResponse:
      type: object
      description: >-
        Outcome of POST /v1/admin/collections/evict (#359): the victims chosen
        least-recently-accessed first, what happened to each (or would, under
        `dry_run`), and the shortfall — per reason, how many collections were
        ineligible. Always 200; fewer than `need` victims is a shortfall, not
        an error.
      required: [need, dry_run, evicted, victims, shortfall]
      properties:
        need:
          description: How many evictions were asked for.
          type: integer
        dry_run:
          description: True — the plan was reported and nothing was changed.
          type: boolean
        evicted:
          description: How many victims THIS call actually made dormant (0 under `dry_run`).
          type: integer
        victims:
          type: array
          items:
            type: object
            required: [collection_id, last_accessed_at, idle_seconds, state, reason, deleted, absent, failed, ok]
            properties:
              collection_id: { type: string }
              last_accessed_at:
                description: The registry's last-access stamp ("" when never recorded).
                type: string
              idle_seconds:
                description: Seconds since that stamp (or since creation) at selection; null when neither is known.
                type: [number, "null"]
              state:
                description: The row's state after this call — `dormant` when evicted, `active` under `dry_run` or when the swap lost.
                type: string
                enum: [active, archiving, dormant, restoring, lost]
              reason:
                description: The recorded state reason (names any leftover physical store), or why the row was skipped.
                type: string
              deleted:
                description: Physical targets removed (`vectors`, `text_index`).
                type: array
                items: { type: string }
              absent:
                description: Targets already gone (idempotent no-op).
                type: array
                items: { type: string }
              failed:
                description: Targets whose drop errored; the row stays `dormant` with the leftover named in `reason`.
                type: array
                items:
                  type: object
                  required: [target, error]
                  properties:
                    target: { type: string }
                    error: { type: string }
                  additionalProperties: false
              ok:
                description: Evicted with nothing left behind (true under `dry_run` for a planned victim).
                type: boolean
            additionalProperties: false
        shortfall:
          type: object
          required: [needed, found, reasons]
          properties:
            needed: { type: integer }
            found: { type: integer }
            reasons:
              description: Per-reason counts over every registry row examined.
              type: object
              required: [not_active, archive_pending, no_archive, in_flight, protected, unregistered]
              properties:
                not_active: { type: integer }
                archive_pending: { type: integer }
                no_archive: { type: integer }
                in_flight: { type: integer }
                protected: { type: integer }
                unregistered: { type: integer }
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false

    ShareGrantRequest:
      type: object
      description: >-
        Grant a share on a collection (POST body). v1 is read-only. `grant_option`
        is not exposed (defaults false) and `owner` cannot be granted here
        (ownership is transferred, not granted).
      required: [grantee]
      properties:
        grantee:
          description: >-
            Who to share with. The literal `@public`/`public` maps to the built-in
            public group (read-only); the form `@group:<id>` (or `group:<id>`)
            maps to a named group by id (read-only, must exist — else 422); a
            value containing `:` is a full `issuer:subject` string kept verbatim;
            `@service:<subject>` names a service account and keeps the subject
            colon-free (required for a machine identity — a bare subject would be
            qualified to `bvbrc:<subject>`, a federated identity it can never
            authenticate as); a bare BV-BRC username is prefixed to
            `bvbrc:<username>`. The resolved subject is echoed back in the
            response so a typo (an unclaimable grant) is visible.
          type: string
          minLength: 1
        permission:
          description: v1 accepts `read` only; `write`/`owner` are rejected.
          type: string
          default: read
        issuer:
          description: Issuer used to qualify a bare username (default `bvbrc`). Ignored for `@public`, `@group:`, `@service:` and for a value that already contains `:`.
          type: string
          default: bvbrc
      additionalProperties: false

    ShareRecord:
      type: object
      description: >-
        One share row as surfaced by the API. `grant_option` is not exposed in v1
        (always false, so it is omitted). `active` is derived from `revoked_at`
        (empty string == active). `grantee_id` is the resolved subject (`user`) or
        group id (`public` for the built-in group).
      required:
        - id
        - collection_id
        - grantee_type
        - grantee_id
        - permission
        - granted_by
        - granted_at
        - revoked_by
        - revoked_at
        - active
      properties:
        id: { type: string }
        collection_id: { type: string }
        grantee_type:
          description: '`user` or `group`.'
          type: string
        grantee_id:
          description: Resolved subject (`issuer:sub`) for a user, or the group id (`public`) for a group.
          type: string
        permission:
          description: '`read` in v1 (the API rejects the rest); `owner` may appear on the owner row surfaced in a listing.'
          type: string
        granted_by:
          description: Subject of the grantor (the caller's tenant), or `system:backfill` for a startup-seeded row.
          type: string
        granted_at:
          description: ISO-8601 UTC timestamp.
          type: string
        revoked_by:
          description: Subject that revoked the row; empty string while active.
          type: string
        revoked_at:
          description: ISO-8601 UTC timestamp of revocation; empty string while active.
          type: string
        active:
          description: True when the row has not been revoked (`revoked_at` is empty).
          type: boolean
      additionalProperties: false

    SharesResponse:
      type: object
      description: A collection's shares plus its current owner subject.
      required: [shares, owner]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareRecord"
        owner:
          description: Subject of the collection's active owner row, or null.
          type: [string, "null"]
      additionalProperties: false

    OwnerTransferRequest:
      type: object
      description: >-
        Transfer ownership of a collection to another user. The subject takes the
        same vocabulary as a share `grantee`, minus the group forms.
      required: [subject]
      properties:
        subject:
          description: >-
            The new owner. A value containing `:` is a full `issuer:subject`
            string kept verbatim; `@service:<subject>` names a service account and
            keeps its subject colon-free; a bare BV-BRC username is prefixed to
            `bvbrc:<username>`. The group forms (`@public`, `@group:<id>`) parse
            but are rejected with 400 — ownership is grantable to users only. The
            resolved subject is echoed back as `owner` so a typo is visible before
            it becomes an unreachable collection.
          type: string
          minLength: 1
        issuer:
          description: Issuer used to qualify a bare username (default `bvbrc`). Ignored for `@service:` and for a value that already contains `:`.
          type: string
          default: bvbrc
      additionalProperties: false

    OwnerTransferResponse:
      type: object
      description: >-
        The result of an ownership transfer. Deliberately explicit about the
        OUTGOING owner: they lose access unless something else grants it back, and
        no consolation `read` share is minted for them.
      required:
        - collection_id
        - owner
        - previous_owner
        - revoked_share_id
        - previous_owner_retains_read
        - share
      properties:
        collection_id: { type: string }
        owner:
          description: "Resolved subject of the NEW owner (the echo of the request's `subject` — a typo is visible here)."
          type: string
        previous_owner:
          description: >-
            Subject of the outgoing owner, whose owner row was soft-revoked —
            never deleted, so the audit trail survives (ADR-0004 decision 6).
          type: string
        revoked_share_id:
          description: >-
            Id of the outgoing owner's now-revoked row, still readable via
            `GET /v1/collections/{id}/shares?include_revoked=true`.
          type: string
        previous_owner_retains_read:
          description: >-
            Whether the outgoing owner can still READ the collection after the
            transfer, re-evaluated through the same authorization seam a request
            uses (an independent share, group membership, or a `public` grant).
            False means no ordinary-user grant survives the transfer. Evaluated as
            an ordinary user — an admin keeps access through the admin bypass
            regardless. Null when the store could not answer; the transfer itself
            had already committed.
          type: [boolean, "null"]
        share:
          description: The new, active owner row.
          $ref: "#/components/schemas/ShareRecord"
      additionalProperties: false

    GroupRecord:
      type: object
      description: >-
        One row of the groups table (ADR-0004 decision 3). `active` is derived
        from `deleted_at`. The built-in 'public' group has id 'public',
        built_in true, and an empty owner_subject.
      required:
        [id, name, owner_subject, built_in, created_at, deleted_by, deleted_at, active]
      properties:
        id:
          type: string
        name:
          type: string
        owner_subject:
          description: Subject of the owning user; empty for the built-in public group.
          type: string
        built_in:
          description: True only for the reserved built-in 'public' group.
          type: boolean
        created_at:
          description: ISO-8601 UTC timestamp.
          type: string
        deleted_by:
          description: Subject that soft-deleted the group; empty while active.
          type: string
        deleted_at:
          description: ISO-8601 UTC timestamp of the soft delete; empty while active.
          type: string
        active:
          description: True when the group has not been soft-deleted.
          type: boolean
      additionalProperties: false

    GroupMemberRecord:
      type: object
      description: >-
        One row of the group_members table. `subject` is always a user subject
        ('issuer:sub'), never a group id (no nesting). `active` is derived from
        `removed_at`.
      required:
        [id, group_id, subject, added_by, added_at, removed_by, removed_at, active]
      properties:
        id:
          type: string
        group_id:
          type: string
        subject:
          description: Resolved subject ('issuer:sub') of the member user.
          type: string
        added_by:
          type: string
        added_at:
          description: ISO-8601 UTC timestamp.
          type: string
        removed_by:
          description: Subject that removed the member; empty while active.
          type: string
        removed_at:
          description: ISO-8601 UTC timestamp of removal; empty while active.
          type: string
        active:
          description: True when the membership has not been removed.
          type: boolean
      additionalProperties: false

    GroupCreateRequest:
      type: object
      description: >-
        Create a group (POST /v1/groups body). The caller becomes owner_subject.
      required: [name]
      properties:
        name:
          description: >-
            Non-empty group name, unique per owner among active groups; 'public'
            is reserved.
          type: string
          minLength: 1
      additionalProperties: false

    GroupMemberAddRequest:
      type: object
      description: >-
        Add a member to a group (POST /v1/groups/{id}/members body). The subject
        is resolved server-side like a share grantee.
      required: [subject]
      properties:
        subject:
          description: >-
            A full 'issuer:subject' string (kept verbatim), '@service:<subject>'
            for a service account (kept colon-free), or a bare BV-BRC username
            (prefixed to 'bvbrc:<username>'). Group-target forms are rejected
            (no nesting).
          type: string
          minLength: 1
        issuer:
          description: Issuer used to qualify a bare username (default 'bvbrc').
          type: string
          default: bvbrc
      additionalProperties: false

    GroupsResponse:
      type: object
      description: The groups the caller owns or is an active member of.
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupRecord"
      additionalProperties: false

    GroupDetailResponse:
      type: object
      description: A single group plus its active membership.
      required: [group, members]
      properties:
        group:
          $ref: "#/components/schemas/GroupRecord"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberRecord"
      additionalProperties: false

    ServiceAccountRecord:
      type: object
      description: >-
        One registered service account (a machine identity authenticated by an
        X-API-Key secret). The `subject` IS the API-key tenant string and the
        authorization subject, so a service account can own collections, receive
        shares and join groups under that one identifier — naming it on those
        surfaces takes the explicit `@service:<subject>` grantee/member form,
        which is what keeps the subject colon-free (a bare value is qualified to
        `bvbrc:<value>`, a federated identity the account can never authenticate
        as). It is colon-free by construction: ':' is reserved for federated
        'issuer:sub' identities so the two namespaces stay disjoint. The reserved
        tenants `default` and `public` are refused as subjects (400) — they are
        shared fallback tenants, so disabling one would lock out every unmapped
        key at once. This record NEVER carries key material, a key prefix or a
        key count — the key<->account mapping lives only in the server
        environment. `last_seen_at` is deliberately absent: the API-key auth path
        writes nothing back, so it would be permanently empty.
      required:
        [subject, purpose, created_by, created_at, disabled_by, disabled_at,
         enabled_by, enabled_at, active]
      properties:
        subject:
          description: >-
            The account's subject: its API-key tenant and its authorization
            identity. Colon-free.
          type: string
          minLength: 1
        purpose:
          description: >-
            Free text recorded at creation: what this credential is for. Empty
            string when not supplied.
          type: string
        created_by:
          description: Subject of the admin who registered the account.
          type: string
        created_at:
          description: ISO-8601 UTC timestamp of registration.
          type: string
        disabled_by:
          description: >-
            Subject of the admin who LAST disabled the account; empty if it has
            never been disabled. History, not state — it SURVIVES a re-enable
            (ADR-0004 decision 6: the audit trail is the point), so read `active`
            for the current state, never `disabled_at != ""`.
          type: string
        disabled_at:
          description: >-
            ISO-8601 UTC timestamp of that last disable; empty if never disabled.
            Kept across a re-enable — see `disabled_by`.
          type: string
        enabled_by:
          description: >-
            Subject of the admin who LAST re-enabled the account; empty if it has
            never been re-enabled.
          type: string
        enabled_at:
          description: >-
            ISO-8601 UTC timestamp of that last re-enable; empty if never
            re-enabled.
          type: string
        active:
          description: >-
            The account's current state — the ONLY field to read for it. True
            when the account is not disabled. Disabling is a soft,
            best-effort revoke: the API-key auth path rejects a disabled
            account's key with 401 within the disabled-check cache TTL, and FAILS
            OPEN if the store cannot answer. The authoritative revoke is removing
            the key from the server environment and restarting.
          type: boolean
      additionalProperties: false

    ServiceAccountsResponse:
      type: object
      description: >-
        The registered service accounts, oldest first. Disabled accounts are
        included — disabling is soft state, never a row deletion.
      required: [service_accounts]
      properties:
        service_accounts:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountRecord"
      additionalProperties: false

    ServiceAccountCreateRequest:
      type: object
      description: >-
        Register a machine identity (POST /v1/admin/service-accounts body). This
        registers the ACCOUNT RECORD only — it does NOT mint, store or rotate a
        credential; the key itself is an environment edit plus a restart. The
        body must therefore never carry key material.
      required: [subject]
      properties:
        subject:
          description: >-
            The account's subject, which must equal the API-key tenant the
            operator maps its key to. Colon-free: ':' is reserved for federated
            'issuer:sub' identities, so a colon here is a 400. The reserved
            tenants 'default' and 'public' are also a 400 — every valid but
            unmapped API key resolves to 'default', so a service row on it would
            turn one disable into a deployment-wide lockout with no way back
            through the API.
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          description: Free text — what this credential is for (audit aid).
          type: string
          default: ""
      additionalProperties: false

    UserRoleRequest:
      type: object
      description: >-
        Set a federated user's stored RBAC role (PATCH
        /v1/admin/users/{subject}/role body). The role is server-side state
        written by an existing admin — it is never read from a token, a claim or
        a header, so no caller can elevate the credential it presents.
      required: [role]
      properties:
        role:
          description: >-
            `admin` (superuser across the whole deployment: every collection,
            all of /v1/admin/*, /v1/config, the model registry) or `user`. Any
            other value is a 400 — `researcher` included: it is a deprecated
            alias accepted only where legacy config is READ, never written here.
            Deliberately NOT an `enum`: the server validates the vocabulary and
            answers 400, and an enum here would make that documented response
            unreachable from a conformant client. `UserRoleRecord` DOES pin the
            enum, because there the server is the writer.
          type: string
      additionalProperties: false

    UserRoleRecord:
      type: object
      description: >-
        A federated user's role state after a grant/revoke. `role` is what is
        STORED; `env_admin` is whether `ADMIN_SUBJECTS` also names this subject,
        in which case the caller is admin regardless of `role` — the env
        allowlist is checked first and short-circuits, so a stored demotion
        cannot override it.
      required: [subject, role, role_set_by, role_set_at, env_admin]
      properties:
        subject:
          description: The federated `issuer:subject` string this row is keyed on.
          type: string
          minLength: 1
        role:
          description: >-
            The stored role: `admin`, `user`, or `""` for a row whose role has
            never been set (equivalent to `user` at the auth path — `""` is the
            table's "not set" sentinel, not a role).
          type: string
        role_set_by:
          description: >-
            Subject of the admin who LAST changed this role; empty if it was
            never set. Append-only audit: a later change overwrites it, a
            revoke never blanks it.
          type: string
        role_set_at:
          description: ISO-8601 UTC timestamp of that last change; empty if never set.
          type: string
        env_admin:
          description: >-
            True when `ADMIN_SUBJECTS` names this subject. Then the caller is
            admin on the auth path no matter what `role` says, and revoking the
            stored role does NOT take the admin away — that is an environment
            edit plus a restart.
          type: boolean
      additionalProperties: false

    LogLevelRequest:
      type: object
      description: >-
        Change the running process's log level without restarting it (PUT
        /v1/admin/log-level body). At least one of `level` or `loggers` must be
        present; a body carrying neither is a 422, because a request that asks
        for nothing is far more likely a typo than an intent. Validation is
        atomic — the whole body is checked before anything is applied, so a
        rejected request leaves the effective level exactly as it was.


        `ttl_seconds` adds an expiry to the change. Every PUT **supersedes** the
        previous one, expiry included: any pending auto-revert is cancelled
        first, and a new one is armed only if this body carries `ttl_seconds`.
        Two overlapping TTLs therefore cannot exist and cannot fight. The
        corollary: a follow-up PUT that omits `ttl_seconds` **disarms** the
        expiry the earlier one armed — visible immediately in the response and on
        the audit line.
      properties:
        level:
          description: >-
            New ROOT log level. Case-insensitive; `warn` is accepted as an alias
            for `WARNING`, because `.env.example` has documented it since before
            `LOG_LEVEL` was honoured at all. `NOTSET` is rejected here: on the
            root logger it means "no threshold" rather than "inherit", and
            turning every library in the process to full DEBUG is not what an
            operator typing it would expect. Deliberately NOT an `enum` — the
            server validates the vocabulary and answers a 4xx, and an enum here
            would make that documented response unreachable from a conformant
            client. That is `UserRoleRequest.role`'s reasoning; note it answers
            **400** there and this answers **422**, because `admin_users.py`
            reserves 400 for a malformed request to keep it distinct from the
            409 its state change can raise, and this endpoint has no such
            neighbour. `LogLevelResponse` DOES pin the enum, because there the
            server is the writer. Omit to leave the root level as it is.
          type: string
          minLength: 1
          maxLength: 16
        loggers:
          description: >-
            Per-logger overrides, as a name→level map. REPLACE semantics:
            whatever is sent becomes the complete set of runtime per-logger
            overrides, so `{}` clears them all and there is no separate "unset
            one logger" verb. Any logger previously overridden and absent here is
            returned to inheriting (NOTSET) before the root level and the dampen
            set are re-applied on top. Omit the whole field to leave the current
            overrides untouched. Names are validated against
            `^[A-Za-z0-9_.-]{1,128}$` and must ALREADY EXIST in the process's
            logger registry — `logging.getLogger(name)` creates a logger
            permanently, so accepting arbitrary names would make this endpoint an
            unbounded-growth path even behind the admin gate. The count is capped
            (`max_logger_overrides` in the response). `ragstack.audit` cannot be
            overridden: it carries this endpoint's own audit trail.
          type: object
          maxProperties: 32
          propertyNames:
            pattern: "^[A-Za-z0-9_.-]{1,128}$"
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 16
        ttl_seconds:
          description: >-
            Auto-revert this change after N seconds. Absent or null means **no
            expiry** — exactly the behaviour this endpoint has always had,
            unchanged. When set, the process reverts to the CONFIGURED defaults
            at the deadline: the same end state `DELETE` produces, **not** a
            restoration of whatever was in force before this PUT, so an override
            an operator had deliberately set beforehand is dropped at expiry too.
            The revert is audited at WARNING as `audit=expired` (distinct from an
            operator's `audit=reset`) carrying the principal that armed it.


            Bounds are **1..86400** (24h): a TTL is for a debugging session an
            operator is present for, and a day bounds the blast radius of a
            forgotten DEBUG — the failure this field exists to prevent. Anything
            longer is a `LOG_LEVEL` change plus a restart, which is reviewable
            and survives the process. The server validates the range and answers
            422 with `{"detail": "<sentence>"}`, atomically with the rest of the
            body; the bounds are declared here as documentation, the way
            `loggers.maxProperties` mirrors `max_logger_overrides`. A body
            carrying ONLY `ttl_seconds` is refused — a TTL modifies a change, it
            is not one.
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
      additionalProperties: false

    LogLevelResponse:
      type: object
      description: >-
        The log level actually in effect in THIS process, and how it got there.
        Returned by GET, PUT and DELETE /v1/admin/log-level.


        The configured/effective split is the point of this shape. `GET
        /v1/config` echoes the RAW `LOG_LEVEL` string, so a value the server
        rejected at start-up is reported there while INFO is what is actually in
        force. Here `configured_level` is that same raw string,
        `configured_level_resolved` is what it resolves to, and `effective_level`
        is what the root logger is set to right now.


        Runtime state is PROCESS-LOCAL and resets on restart — see the PUT
        operation for why that is deliberate and what would change if
        `--workers` were ever added.


        A `ttl_seconds` expiry is reported by `auto_revert_pending`,
        `expires_at` and `expires_in_seconds`. It is process-local too, and it is
        dropped at shutdown without firing — a restart reverts the level anyway,
        so an expiry that outlived its process would have nothing left to revert.
      required:
        [pid, configured_level, configured_level_resolved, effective_level,
         runtime_override, changed_at, changed_by, dampening_active,
         dampen_loggers, loggers, logger_override_count, max_logger_overrides,
         auto_revert_pending, ttl_seconds, expires_at, expires_in_seconds,
         max_ttl_seconds]
      properties:
        pid:
          description: >-
            OS process id that answered. Runtime log state lives in this process
            only.
          type: integer
        configured_level:
          description: >-
            The RAW `LOG_LEVEL` setting, exactly as `GET /v1/config` echoes it —
            including a value the server rejected. Compare with
            `configured_level_resolved` to see whether it was understood.
          type: string
        configured_level_resolved:
          description: >-
            What `configured_level` resolves to after upper-casing and
            validation; INFO when it was unrecognised. This is what a restart
            would return the process to.
          type: string
          enum: [CRITICAL, FATAL, ERROR, WARNING, WARN, INFO, DEBUG, NOTSET]
        effective_level:
          description: >-
            The root logger's level RIGHT NOW. Equals
            `configured_level_resolved` unless `runtime_override` is true. It
            governs every logger that inherits from root — which is not all of
            them: `uvicorn.*` sets `propagate=False` and carries its own
            handlers, so it consults its own level and is unaffected by this
            field. Name a uvicorn logger in `loggers` to reach it.
          type: string
          enum: [CRITICAL, FATAL, ERROR, WARNING, WARN, INFO, DEBUG, NOTSET]
        runtime_override:
          description: >-
            True when a PUT has changed the root level in this process since it
            started (or since the last DELETE). False means `effective_level`
            came from configuration.
          type: boolean
        changed_at:
          description: >-
            ISO-8601 UTC timestamp of the last runtime change (PUT, DELETE, or a
            `ttl_seconds` auto-revert); empty string if this process has never had
            one. Empty rather than null, matching `UserRoleRecord.role_set_at`.
          type: string
        changed_by:
          description: >-
            Tenant of the admin principal who made that last change; empty string
            if there has never been one. A NON-empty `changed_at` with an EMPTY
            `changed_by` is the signature of an auto-revert: the process changed
            its own level and no principal typed it; the `audit=expired` line
            names the principal that armed the TTL. The same identity appears on
            the WARNING
            audit line in the log, which is the durable record — this field is a
            convenience and dies with the process.
          type: string
        dampening_active:
          description: >-
            True when the loggers in `dampen_loggers` are pinned to WARNING. They
            are pinned whenever the effective level is above DEBUG and released
            at DEBUG, so that turning the root level down actually turns the HTTP
            transports on — which is the whole reason to turn it down. A single
            `/v1/query` makes 5 outbound HTTP calls minimum and up to ~14 on the
            multi-collection path, one `httpx` INFO line each, so leaving them
            un-damped at INFO would bury our own lines at 1:5.
          type: boolean
        dampen_loggers:
          description: >-
            The configured dampen set (`LOG_DAMPEN_LOGGERS`). A name here can
            still be overridden explicitly; the override wins and the entry in
            `loggers` then reads `source: override`.
          type: array
          items: { type: string }
        loggers:
          description: >-
            Every logger this endpoint currently touches: the runtime overrides
            and the dampen set, unioned. `level` is that logger's OWN level
            (NOTSET = it inherits from root). The per-logger overrides are
            exactly the entries with `source: override`.
          type: array
          items:
            type: object
            required: [name, level, source]
            properties:
              name:
                description: The logger's dotted name.
                type: string
              level:
                description: >-
                  The level set on this logger itself. NOTSET means it inherits
                  from root rather than meaning "silent".
                type: string
                enum: [CRITICAL, FATAL, ERROR, WARNING, WARN, INFO, DEBUG, NOTSET]
              source:
                description: >-
                  `override` — a runtime per-logger override set through this
                  endpoint. `dampen` — a member of the configured dampen set, at
                  whatever the current root level implies.
                type: string
                enum: [override, dampen]
            additionalProperties: false
        logger_override_count:
          description: How many runtime per-logger overrides are in force.
          type: integer
        max_logger_overrides:
          description: >-
            The cap on that count. A PUT that would exceed it is a 422 and
            changes nothing.
          type: integer
        auto_revert_pending:
          description: >-
            True when a `ttl_seconds` expiry is armed and this process will
            change its own log level when it fires. An operator MUST be able to
            see this: the level is going to move under them, and nothing else in
            this response would say so. False exactly when `expires_in_seconds`
            is null.
          type: boolean
        ttl_seconds:
          description: >-
            The TTL that was requested on the change now in force, or null when
            none is armed. The value as sent, not a countdown —
            `expires_in_seconds` is the countdown.
          type: [integer, "null"]
        expires_at:
          description: >-
            ISO-8601 UTC wall-clock deadline of the pending auto-revert; empty
            string when none is armed (empty rather than null, matching
            `changed_at`). `expires_in_seconds` is measured on a MONOTONIC clock
            and is the authority — this field is for a human, and a wall-clock
            step (NTP, a suspended VM) moves it without moving the deadline.
          type: string
        expires_in_seconds:
          description: >-
            Seconds remaining until the auto-revert fires, rounded UP so a
            freshly armed 600s TTL reads 600; null when none is armed. Clamped at
            0 rather than going negative: 0 with `auto_revert_pending: true`
            means the deadline has passed and the callback has not run yet, which
            on a busy loop is a moment, not a state.
          type: [integer, "null"]
        max_ttl_seconds:
          description: >-
            The upper bound on `ttl_seconds` (the lower bound is 1). A PUT
            outside the range is a 422 and changes nothing. Reported the way
            `max_logger_overrides` is, so the bound is discoverable at runtime
            rather than only in this document.
          type: integer
      additionalProperties: false

    CollectionCreateRequest:
      type: object
      properties:
        embedding:
          description: >-
            Id of a registered model whose task is `embedding`. Its base_urls are
            SSRF-checked at registration; the model must declare a positive `dim`.
            Optional — omitted, the server's default embedding backend (model,
            dim and endpoints from server config) is resolved in. Supplying it
            is an admin-only build-spec override (403 otherwise).
          type: string
          minLength: 1
        chunk:
          description: >-
            Chunk strategy — part of the collection's build identity, so it is
            fixed at creation and cannot be edited later. An unknown `method`, or
            a size/overlap the chosen chunker cannot advance through, is a 400.
            Optional — omitted, the server's default chunk strategy (method,
            size, overlap from server config) is resolved in. Supplying it is
            an admin-only build-spec override (403 otherwise).
          type: object
          required: [method]
          properties:
            method:
              description: >-
                One of `fixed`, `fixed_token`, `sentence`, `words`, `semantic`,
                `semantic_pooled` (the server's CHUNK_METHODS). Anything else is
                a 400.
              type: string
              minLength: 1
            size:
              description: >-
                Chunk budget: characters for `fixed`/`sentence`/`words`, tokens of
                the collection's embedding model for `fixed_token`. Must be >= 1
                (`sentence`/`words` also accept -1 = one chunk per document).
                Omit for the semantic methods, which derive boundaries from the
                text — a size sent there would be recorded in the collection's
                provenance without ever having been used.
              type: [integer, "null"]
            overlap:
              description: >-
                Overlap between neighbouring chunks, in the same unit as `size`.
                Must be >= 0 and strictly less than `size`, otherwise the sliding
                window never advances. Omit for the semantic methods.
              type: [integer, "null"]
            params:
              description: >-
                Extra chunker parameters. The semantic methods read `buffer_size`
                (1-50), `breakpoint_percentile_threshold` (1-100) and
                `min_chunk_length` (0-100000); anything omitted falls back to the
                server default. Unrecognised keys are accepted and stored as-is.
              type: object
              default: {}
          additionalProperties: false
        id:
          description: >-
            Optional explicit id, naming a *library*. When given, the id is also
            folded into the physical store name, so two libraries built from the
            same (model, dim, chunk) spec are isolated from each other rather than
            aliasing one store. Omitted → both the id and the physical name are
            derived from the content-addressed (model, dim, chunk) signature.
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 256
      additionalProperties: false

    CollectionsResponse:
      type: object
      required: [collections, default]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionInfo"
        default:
          description: >-
            The id a request from **this caller** targets when it omits
            `collection`: the registry default when this caller can see it
            (allowlist AND read), else the first collection in `collections`.
            Always one of the listed ids — **or the empty string when
            `collections` is empty**, i.e. the caller can read no collection at
            all and `/v1/query`, `/v1/retrieve` and `/v1/chunks` answer 404 `no
            collection is accessible to this caller`. Clients that want a
            deterministic target should send this id explicitly on `/v1/query`,
            `/v1/retrieve` and `/v1/chunks`.
            It is **not** the same thing as the per-item `is_default` flag, which
            is the global registry pointer.
          type: string

    ChunkOut:
      type: object
      required: [doc_id, chunk_id, content]
      properties:
        doc_id: { type: string }
        chunk_id: { type: string }
        content: { type: string }
        metadata:
          type: object
          default: {}
      additionalProperties: false

    ModelEntry:
      type: object
      required: [id, task]
      properties:
        id: { type: string }
        task:
          type: string
          enum: [embedding, tokenizer, llm, reranker]
        provider:
          type: string
          enum: [sidecar, openai, vllm]
          default: openai
        base_urls:
          type: array
          items: { type: string }
        model: { type: string }
        dim: { type: [integer, "null"] }
        params: { type: object, default: {} }
      additionalProperties: false

    ModelsRegistryResponse:
      type: object
      required: [models, assignments]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelEntry" }
        assignments:
          description: task -> model id, for the hot-swappable tasks (llm / reranker).
          type: object
          additionalProperties: { type: string }

    AssignmentsPatch:
      type: object
      description: Only the fields present are changed; null reverts to the default.
      properties:
        llm: { type: [string, "null"] }
        reranker: { type: [string, "null"] }
      additionalProperties: false

    AvailableModel:
      type: object
      required: [id, task, label, model, provider]
      properties:
        id: { type: string }
        task: { type: string, enum: [llm, reranker] }
        label: { type: string }
        model: { type: string }
        provider: { type: string }
      additionalProperties: false

    AvailableModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/AvailableModel" }

    ChunksResponse:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/ChunkOut"
      additionalProperties: false

    IngestRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
        metadata:
          type: object
          default: {}
        collection:
          description: >-
            Target collection id (from GET /v1/collections). Omitted → the server
            default collection. Documents are indexed with the target collection's
            bound embedder/chunker; an unknown id returns 404.
          type: [string, "null"]

    IngestResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
        chunk_ids:
          type: array
          items:
            type: string
          default: []
        items:
          type: [object, "null"]
          description: Per-document progress for batch/directory ingests.
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            pending:
              type: integer

    DocumentInfo:
      type: object
      required: [doc_id, source]
      properties:
        doc_id:
          type: string
        source:
          type: string
        metadata:
          type: object
          default: {}

    EntityInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
        triple_count:
          type: integer
          default: 0

    TripleResponse:
      type: object
      required: [subject, predicate, object]
      properties:
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        evidence:
          type: string
          default: ""
          description: Verbatim span the triple was read from (empty when unknown).
        chunk_id:
          type: string
          default: ""
          description: Chunk that produced the triple (empty when unknown).
        derived_by:
          type: string
          default: ""
          description: '"llm", "tool:<source>" or "" (unknown).'
        confidence:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: >-
            0 unknown, 1 LLM-plausible, 2 corroborated by a tool, 3 verified against
            a structured source. An LLM-derived triple is never above 1.
        subject_id:
          type: string
          default: ""
          description: Optional typed id for the subject, e.g. bvbrc:genome:<id>.
        object_id:
          type: string
          default: ""
          description: Optional typed id for the object, e.g. bvbrc:genome:<id>.

    Source:
      type: object
      required: [doc_id, chunk_id, content, score]
      properties:
        doc_id:
          type: string
        chunk_id:
          type: string
        content:
          type: string
        score:
          type: number
        metadata:
          type: object
          default: {}
        collection:
          description: >-
            The registry collection id this source came from. Present only on a
            multi-collection request (`collections`, issue #253) — a
            single-collection request's response is unchanged.
          type: string
        context:
          description: >-
            Neighbouring chunks of the same document, attached only when the
            request set context_window > 0 and at least one neighbour is
            visible; absent otherwise. Ordered by position (negative = before
            the source, positive = after). A neighbour that is itself a
            returned source is omitted here rather than duplicated.
          type: array
          items:
            $ref: "#/components/schemas/ContextChunk"

    ContextChunk:
      type: object
      description: >-
        One neighbouring chunk attached to a Source by context_window (#322).
      required: [chunk_id, position, content]
      properties:
        chunk_id:
          type: string
        position:
          description: >-
            Offset from the source in chunks: -1 is the immediately preceding
            chunk, 1 the following one.
          type: integer
        content:
          type: string
      additionalProperties: false

    JobItemCounts:
      type: object
      description: Per-item status counts for a resumable manifest run (zeros otherwise).
      required: [pending, completed, failed]
      properties:
        pending: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
      additionalProperties: false

    JobSummary:
      type: object
      description: One ingest job's tracked state (admin view).
      required: [job_id, status, source, error, chunks, items]
      properties:
        job_id: { type: string }
        status: { type: string }
        source: { type: string }
        error:
          type: string
          description: Caller-safe error label (exception class only, never raw messages).
        chunks:
          type: integer
          description: Count of chunk_ids stamped on the job record (single-doc runs).
        items: { $ref: "#/components/schemas/JobItemCounts" }
      additionalProperties: false

    JobsResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobSummary" }
      additionalProperties: false

    EndpointStatus:
      type: object
      description: Reachability of one model-serving endpoint.
      required: [url, reachable, latency_ms, detail, in_flight, pool_healthy]
      properties:
        url: { type: string }
        reachable: { type: boolean }
        latency_ms: { type: [number, "null"] }
        detail: { type: [string, "null"] }
        in_flight:
          type: [integer, "null"]
          description: In-flight requests (pooled embedder only; null otherwise).
        pool_healthy: { type: [boolean, "null"] }
      additionalProperties: false

    ModelStatus:
      type: object
      description: Status of one model role across its endpoints.
      required: [role, model, backend, dim, endpoints, reachable, note]
      properties:
        role:
          type: string
          description: '"embedding" | "llm" | "reranker".'
        model: { type: string }
        backend: { type: [string, "null"] }
        dim: { type: [integer, "null"] }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/EndpointStatus" }
        reachable:
          type: boolean
          description: True if any endpoint is up.
        note:
          type: [string, "null"]
          description: '"not configured" | "disabled" | null.'
      additionalProperties: false

    ModelsStatusResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelStatus" }
      additionalProperties: false

    BenchmarkRequest:
      type: object
      description: Bounds keep the probe from becoming a load test.
      properties:
        embed_batch: { type: integer, minimum: 1, maximum: 128, default: 32 }
        llm_tokens: { type: integer, minimum: 16, maximum: 512, default: 128 }
      additionalProperties: false

    BenchResult:
      type: object
      description: One model's benchmark timing.
      required: [model, ok, seconds, items, items_per_sec, tokens_per_sec, detail]
      properties:
        model: { type: string }
        ok: { type: boolean }
        seconds: { type: [number, "null"] }
        items: { type: [integer, "null"] }
        items_per_sec: { type: [number, "null"] }
        tokens_per_sec: { type: [number, "null"] }
        detail: { type: [string, "null"] }
      additionalProperties: false

    BenchmarkResponse:
      type: object
      required: [embedding, llm]
      properties:
        embedding: { $ref: "#/components/schemas/BenchResult" }
        llm: { $ref: "#/components/schemas/BenchResult" }
      additionalProperties: false
