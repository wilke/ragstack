# /rag/config/proxy/snippets/proxy-common.conf — include INSIDE a location.
# Standard forwarding headers + WebSocket upgrade passthrough.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# NOT $scheme / $host. This gateway sits behind the BV-BRC front proxy for
# public traffic: the browser speaks https to www.bv-brc.org, but that proxy
# speaks plain http to us and rewrites Host to coconut.cels.anl.gov:9000. Told
# $scheme, an upstream that builds absolute URLs (FastAPI redirects, the Swagger
# page) would emit http:// links on an https page and the browser would block
# them as mixed content.
#
# The maps in conf.d/00-maps.conf pass through what the front proxy sent and
# fall back to our own values when nothing was sent — so direct on-campus
# access to :9000 / :9443 behaves exactly as before.
#
# These values only ever shape URLs an upstream generates; they are not
# authentication input, so a forged header from a direct caller misleads that
# caller's own links and nothing else.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $forwarded_host;
proxy_set_header X-Forwarded-Port  $server_port;

# Vite HMR and GoWe live updates both ride WebSockets through here.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Token-by-token LLM output must not sit in a proxy buffer.
proxy_buffering off;
proxy_request_buffering off;
