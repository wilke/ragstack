# /rag/config/proxy/snippets/cors.conf — include INSIDE a location.
#
# $cors_origin is "" for any origin not in the allowlist (conf.d/00-maps.conf),
# and add_header with an empty value emits nothing — so an unlisted origin gets
# a response with no CORS headers and the browser blocks it.

# Strip the upstreams' own CORS headers first. ragstack and vLLM both answer
# `access-control-allow-origin: *`; leaving that in place alongside ours would
# produce two conflicting headers and the browser rejects the response.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Max-Age;

# Preflight is answered by the gateway itself — never forwarded. Headers must be
# repeated here: an `if` block with its own add_header does not inherit the
# location's.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Requested-With, Accept" always;
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;
    add_header Content-Length               0;
    add_header Content-Type                 "text/plain charset=UTF-8";
    return 204;
}

add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Request-Id" always;
# Vary: Origin so a shared cache cannot hand an ldkb.org-stamped response to a
# different origin.
add_header Vary                         Origin always;
