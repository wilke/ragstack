# /rag/config/proxy/snippets/routes.conf — the gateway's route table.
# Included by BOTH the :9000 (http) and :9443 (https) server blocks so the two
# listeners can never drift apart.
#
#   /                                  -> this index
#   /health                            -> gateway liveness (does not probe upstreams)
#   /ragstack/                         -> tenant landing page (HTML)
#   /ragstack/tenants                  -> tenant table (JSON)
#   /ragstack/health                   -> gateway liveness, reachable under the public mount
#   /ragstack/<tenant>/api/...         -> that tenant's ragstack API (prefix stripped)
#   /ragstack/<tenant>/ui/...          -> that tenant's Vite dev server (prefix PRESERVED)
#
# PUBLIC MOUNT — this gateway is reachable two ways, and both must work:
#
#   https://www.bv-brc.org/ragstack/...   (public; Cloudflare -> BV-BRC nginx -> here)
#   http://coconut.cels.anl.gov:9000/...  (on-campus, direct)
#
# The BV-BRC front proxy forwards to :9000 with the path PRESERVED — a request
# for /ragstack/dev/ui/ arrives here as exactly /ragstack/dev/ui/ — and rewrites
# Host to coconut.cels.anl.gov:9000. Two consequences that shape this file:
#
#   1. Every path below is already correct under both entry points, because the
#      public prefix and the gateway prefix are the same string. Do not add a
#      rewrite for the public mount; there is nothing to strip.
#   2. Any link or redirect we emit must be RELATIVE or root-relative. An
#      absolute URL built from $host would name coconut...:9000, which a public
#      client generally cannot reach — see absolute_redirect below.
#
# The /models/... and /gowe/ routes were REMOVED on 2026-08-25 (this gateway now
# fronts the ragstack tenants only). The last version carrying them is
# routes.conf.bak-bvbrc-mount-20260825-162855. GoWe itself is untouched and
# still served at the root of its own listener — :8081 / :8444, conf.d/20-gowe.conf.

# nginx would otherwise turn `return 301 /foo/` into an absolute
# $scheme://$host/foo/ — i.e. http://coconut.cels.anl.gov:9000/..., leaking the
# internal address to a public client and downgrading https to http. Relative
# Locations resolve against whatever URL the browser actually used.
absolute_redirect off;

location = / {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 200 '{"service":"coconut-proxy","routes":{"health":"/health","ragstack":"/ragstack/","tenants":"/ragstack/tenants","ragstack_api":"/ragstack/<tenant>/api/v1/...","ragstack_ui":"/ragstack/<tenant>/ui/"},"tenants":["dev","demo","lucid-next","asm-next"]}\n';
}

location = /health {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 200 '{"status":"ok","service":"coconut-proxy"}\n';
}

# ---------------------------------------------------------------------------
# ragstack — landing page
# ---------------------------------------------------------------------------
# https://www.bv-brc.org/ragstack/ lands here. Before this existed it fell to
# the catch-all below and answered a JSON 404, which reads as "the mount is
# broken" even though every tenant underneath it was serving fine.
location = /ragstack {
    include /rag/config/proxy/snippets/cors.conf;
    default_type text/html;
    alias /rag/config/proxy/html/ragstack.html;
}

# An internal rewrite, NOT a second `alias`: for a location whose name ends in
# "/", nginx treats the alias as a directory and appends the index file, so it
# would look for ".../ragstack.htmlindex.html" and 500.
location = /ragstack/ {
    rewrite ^ /ragstack last;
}

# Machine-readable twin of the landing page.
location = /ragstack/tenants {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 200 '{"tenants":[{"name":"dev","api":"/ragstack/dev/api/v1/...","ui":"/ragstack/dev/ui/"},{"name":"demo","api":"/ragstack/demo/api/v1/...","ui":"/ragstack/demo/ui/"},{"name":"lucid-next","api":"/ragstack/lucid-next/api/v1/...","ui":"/ragstack/lucid-next/ui/"},{"name":"asm-next","api":"/ragstack/asm-next/api/v1/...","ui":"/ragstack/asm-next/ui/"}]}\n';
}

# The bare /health above is NOT reachable through the public mount — only paths
# under /ragstack/ are forwarded to us. This is the same answer at a path a
# public monitor can actually hit.
location = /ragstack/health {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 200 '{"status":"ok","service":"coconut-proxy"}\n';
}

# ---------------------------------------------------------------------------
# Services  (/ragstack/services/<name>)
# ---------------------------------------------------------------------------
# Stable URLs for services on this host that this gateway does NOT front. These
# REDIRECT rather than proxy — see the $service_target map in conf.d/00-maps.conf
# for why that is deliberate for each one (base-path limits, and a dev proxy
# holding a live BV-BRC token that must not be published to the internet).
#
# Both spellings work: /ragstack/services/vaxpipe and .../vaxpipe/.
#
# Placed BEFORE the tenant regexes below. It would win anyway — those require
# /api or /ui after the name, which this path does not have — but a tenant can
# never be called "services" while this is here, and the ordering makes that
# explicit rather than incidental.
#
# NOTE the targets are absolute URLs on other ports, so they are only reachable
# from inside the network. Followed from outside, they will not resolve; that is
# the intended behaviour, not a bug to fix by proxying.
# Grafana (:3001, loopback-only until this mount existed).
#
# Prefix STRIPPED — the opposite of the tenant UIs — because Grafana is NOT
# configured for a sub-path: GF_SERVER_ROOT_URL and GF_SERVER_SERVE_FROM_SUB_PATH
# are both unset. It gets away with it because it emits asset paths RELATIVE
# ("public/build/...", no leading slash), which resolve correctly under any
# prefix. Verified: css, js and images all 200 through this mount.
#
# What relative paths do NOT fix, and why this is still provisional:
#   * its 302 to /login is root-absolute, so proxy_redirect below rewrites it;
#   * the header logo is href="/", which escapes the mount to the gateway root.
# Setting serve_from_sub_path + root_url on Grafana fixes both at the source and
# is the supported arrangement; this mount is the version that works without
# restarting someone else's service.
# THE RECURRING TRAP: a plain-prefix location loses to the generic services
# regex further down, which matches "<name>" and "<name>/" and answers 404 for
# any name with no redirect target. So every proxied service needs these two
# exact locations as well — vaxpipe has the same pair. Exact matches outrank
# every regex; deeper paths are unaffected because that regex ends after the
# optional slash.
location = /ragstack/services/grafana {
    return 301 /ragstack/services/grafana/;
}

location = /ragstack/services/grafana/ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    # Prefix PRESERVED (no URI part). Grafana runs with
    # GF_SERVER_SERVE_FROM_SUB_PATH=true and GF_SERVER_ROOT_URL set to this
    # mount, so it expects the prefix and emits its own base href, appSubUrl and
    # redirects correctly. Stripping it here would make Grafana add the prefix
    # back on every redirect and this proxy remove it again — an endless loop,
    # which is exactly what happened for a few minutes during the cutover.
    proxy_pass http://127.0.0.1:3001;
}

location /ragstack/services/grafana/ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;


    # See the note on the exact-index location above: prefix PRESERVED, because
    # Grafana is now configured for this sub-path and handles its own URLs.
    proxy_pass http://127.0.0.1:3001;
}

# GoWe, mounted under its own base path. Production :8091 has run v0.19.0 with
# --base-path /ragstack/services/gowe/ui since 2026-09-09, so this is no longer
# a release candidate on a side port — it is GoWe.
#
# Prefix PRESERVED, no URI part, no X-Forwarded-Prefix: the server is told its
# own base by the flag, so nothing here needs to rewrite paths. GoWe dual-mounts,
# answering under both the prefix and the root, which is what keeps the :8081 /
# :8444 listener and direct CLI access working unchanged.
#
# This guard is the prefix-anchored twin of snippets/gowe-worker-guard.conf,
# which is anchored at ^/api/v1/workers and therefore matches nothing under a
# path prefix. It reuses the same $gowe_worker_denied map. Belt and suspenders:
# the candidate runs WITH --worker-keys, so the server already enforces worker
# auth itself and every one of these answers 401 on its own. Kept because this
# is a public edge, and because production must carry the same rule the day the
# server's own enforcement is misconfigured.
location ~ ^/ragstack/services/gowe/ui/api/v1/workers(?<gwrest>/.*)?$ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    if ($gowe_worker_denied = "denied") {
        add_header Content-Type application/json always;
        return 403 '{"error":"worker endpoints are not available through this proxy","hint":"these authenticate with X-Worker-Key; workers connect to the API port directly"}\n';
    }
    proxy_pass http://gowe_backend;
}

# Prefix PRESERVED, no URI part, no X-Forwarded-Prefix — the contract agreed
# with the GoWe side; the server is told its own base via --base-path.
location /ragstack/services/gowe/ui/ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    proxy_pass http://gowe_backend;
}

# Bare mount: let GoWe issue its own 301 to the slash form, so the redirect is
# the server's and stays correct if the base ever changes.
# /ragstack/services/gowe used to redirect out to the :8081 listener; now that
# GoWe is properly mounted it belongs at the mount.
location = /ragstack/services/gowe {
    return 301 /ragstack/services/gowe/ui/;
}

location = /ragstack/services/gowe/ui {
    include /rag/config/proxy/snippets/proxy-common.conf;
    proxy_pass http://gowe_backend;
}

# Vaxpipe's GoWe API — allowlisted, and forwarded STRAIGHT to GoWe. MUST stay
# above the UI location below and above the services regexes: this is a regex
# location, so it is chosen over the plain-prefix UI mount, which is exactly why
# that mount is no longer `^~`.
#
# Publishing the UI publicly also published everything its dev proxy forwards,
# including GoWe's worker-registration endpoints, which authenticate with
# X-Worker-Key and are open when the server runs without --worker-keys. See
# $vaxpipe_api_allowed in conf.d/00-maps.conf for the detail and the durable fix.
location ~ ^/ragstack/services/vaxpipe/api/v1(?<vaxrest>/.*)?$ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    if ($vaxpipe_api_allowed = "") {
        add_header Content-Type application/json always;
        return 403 '{"error":"endpoint not available through the public mount","path":"$uri","hint":"the gateway forwards only the GoWe endpoints this UI uses; worker-fleet endpoints are refused because they are unauthenticated on this server"}\n';
    }

    # Prefix STRIPPED and the call handed to GoWe itself (2026-09-10; until
    # then it went to the Vite dev server, whose own proxy forwarded it). The
    # Vite hop existed only to inject GOWE_TOKEN, which is gone — the browser
    # sends its own token, and this passes it through untouched. Going direct
    # takes an orphaned dev process (not restored after a reboot) out of the
    # public API path and matches how the tenant routes below reach their APIs.
    # GoWe knows nothing about the mount, hence the URI part; $vaxrest is the
    # captured remainder, and $is_args$args carries the query string, which a
    # proxy_pass with variables does not append on its own.
    proxy_pass http://gowe_backend/api/v1$vaxrest$is_args$args;
}

# Vaxpipe — PROXIED, the same shape as a ragstack tenant UI: `^~` so it wins
# over the redirect regex below, and proxy_pass with no URI part so the prefix
# reaches Vite unchanged. Vite is started with a matching base (BASE_PATH in
# ui/.env.local), which is what makes its asset URLs line up.
#
# Its /bvbrc/* calls ride this same route: the dev server proxies them onward
# to BV-BRC (fixed upstream paths, no GoWe involved), with the browser
# supplying its own token. /api/v1 does NOT — the regex location above sends it
# straight to GoWe. Nothing here injects a credential — see the note on
# vaxpipe_ui in 00-maps.conf.
location /ragstack/services/vaxpipe/ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    proxy_pass http://vaxpipe_ui;
}

# Bare name -> the slash form Vite's base expects. `absolute_redirect off` keeps
# this Location relative, so it stays correct under both www.bv-brc.org and
# coconut:9000.
location = /ragstack/services/vaxpipe {
    return 301 /ragstack/services/vaxpipe/;
}

# The index, as an EXACT location. Needed because dropping `^~` above (so the
# API guard's regex can win) also let the generic services regex below outrank
# the plain-prefix mount for this one URI — it matches "<name>/" and would
# answer 404 for a service that no longer has a redirect target. An exact match
# outranks every regex, so this settles it. Deeper paths are unaffected: the
# generic regex ends after the optional slash and never matches them.
location = /ragstack/services/vaxpipe/ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    proxy_pass http://vaxpipe_ui;
}

location ~ ^/ragstack/services/(?<service>[A-Za-z0-9_-]+)/?$ {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;

    if ($service_target = "") {
        return 404 '{"error":"unknown service","service":"$service","services":["vaxpipe","gowe"],"hint":"GET /ragstack/services"}\n';
    }

    # `absolute_redirect off` at the server level rewrites only the Locations
    # nginx generates itself; an absolute URL given here is sent verbatim.
    return 302 $service_target;
}

location = /ragstack/services {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 200 '{"services":[{"name":"vaxpipe","what":"Vaxpipe UI","url":"/ragstack/services/vaxpipe/","port":5174,"mount":"proxied","reachable":"anywhere"},{"name":"gowe","what":"GoWe workflow engine","url":"/ragstack/services/gowe/ui/","port":8091,"mount":"proxied","reachable":"anywhere"},{"name":"grafana","what":"Grafana dashboards","url":"/ragstack/services/grafana/","port":3001,"mount":"proxied","reachable":"anywhere"}]}\n';
}

location = /ragstack/services/ {
    rewrite ^ /ragstack/services last;
}

# ---------------------------------------------------------------------------
# ragstack — API
# ---------------------------------------------------------------------------
# The /ragstack/<tenant>/api prefix is STRIPPED: the upstream serves its routes
# at /v1/... and knows nothing about the tenant path.
location ~ ^/ragstack/(?<tenant>[A-Za-z0-9_-]+)/api(?:/(?<rest>.*))?$ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    # For the `return`s below only. A proxied response carries the upstream's
    # own Content-Type; without this the JSON errors here inherit the http-level
    # application/octet-stream and a browser downloads them instead of showing
    # them.
    default_type application/json;

    # Read-only guard. One combined test instead of nested ifs (nginx `if` inside
    # location is famously fragile): the two maps concatenate to "row" only when a
    # read-only tenant meets a mutating method+path.
    # `set` concatenates; an if-condition does NOT — nginx parses "$a$b" there as
    # one variable name and fails to load with "unknown variable".
    set $ro_write "$tenant_readonly$ragstack_write";
    if ($ro_write = "row") {
        add_header Content-Type application/json always;
        return 403 '{"detail":"tenant is read-only at the gateway during migration; writes are disabled here. This is a gateway guard, not authorization."}\n';
    }

    if ($tenant_api = "") {
        return 404 '{"error":"unknown tenant","tenant":"$tenant","tenants":["dev","demo","lucid-next","asm-next"],"hint":"GET /ragstack/tenants"}\n';
    }

    # Tell the upstream which prefix it is mounted under. Because this location
    # STRIPS the prefix, FastAPI otherwise renders its Swagger page with a
    # root-absolute `url: '/openapi.json'` — the gateway's own root, which
    # belongs to no tenant and 404s ("Failed to load API definition").
    #
    # This value is correct for the public mount too: BV-BRC forwards with the
    # path preserved, so /ragstack/<tenant>/api is the prefix under BOTH
    # www.bv-brc.org and coconut:9000. If that front proxy is ever changed to
    # strip or rename the prefix, this line is what has to change with it.
    #
    # It lives HERE, not in the shared proxy-common.conf: the ui locations are
    # mounted under a different prefix and one shared value would be wrong for
    # them. `proxy_set_header` also OVERWRITES anything a client sent, so the
    # upstream cannot be fed a forged prefix from outside. The upstream
    # validates it anyway (api/root_path.py) and ignores anything that is not a
    # plain path — belt and braces, since the value ends up in the docs page's
    # fetch URL.
    proxy_set_header X-Forwarded-Prefix /ragstack/$tenant/api;

    proxy_pass http://$tenant_api/$rest$is_args$args;

    # An upstream redirect to /v1/... must come back out under the tenant prefix.
    proxy_redirect ~^/(.*)$ /ragstack/$tenant/api/$1;
}

# ---------------------------------------------------------------------------
# ragstack — UI (Vite dev servers)
# ---------------------------------------------------------------------------
# Prefix PRESERVED — proxy_pass carries no URI part, so the original request URI
# goes upstream unchanged. A Vite dev server started with
# `--base /ragstack/<tenant>/ui/` expects exactly that and will emit its asset
# URLs under the same prefix. Started WITHOUT that flag it will serve index.html
# here but reference assets at the gateway root, where they 404 — see the note
# on $tenant_ui in conf.d/00-maps.conf.
location ~ ^/ragstack/(?<tenant>[A-Za-z0-9_-]+)/ui(?:/.*)?$ {
    include /rag/config/proxy/snippets/cors.conf;
    include /rag/config/proxy/snippets/proxy-common.conf;

    default_type application/json;   # for the `return` below only; see the api location

    if ($tenant_ui = "") {
        return 404 '{"error":"no UI configured for tenant","tenant":"$tenant","hint":"GET /ragstack/tenants"}\n';
    }
    proxy_pass http://$tenant_ui;
}

# ---------------------------------------------------------------------------
# Catch-all
# ---------------------------------------------------------------------------
# Anything that matches no route above — /ragstack/dev/ (no /api or /ui), a
# typo, or a stale /models//gowe link — would otherwise fall through to nginx's
# built-in document root and return an HTML 404 whose error-log entry is a
# confusing "/etc/nginx/html/... is not found". Answer with the route index
# instead, so a wrong URL tells you the right ones.
#
# A prefix location, so it loses to every regex and exact location above;
# `location = /` still wins for the bare root.
location / {
    include /rag/config/proxy/snippets/cors.conf;
    default_type application/json;
    return 404 '{"error":"no route","path":"$uri","routes":{"health":"/health","ragstack":"/ragstack/","tenants":"/ragstack/tenants","ragstack_api":"/ragstack/<tenant>/api/v1/...","ragstack_ui":"/ragstack/<tenant>/ui/"},"tenants":["dev","demo","lucid-next","asm-next"]}\n';
}
