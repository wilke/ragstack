# /rag/config/proxy/conf.d/10-gateway.conf — the main gateway.
#
# Same routes on both listeners (snippets/routes.conf); HTTP is NOT redirected
# to HTTPS. Deliberate: the cert here is self-signed, and a forced redirect
# would break the server-side and curl callers that work fine over plain HTTP
# today. Browser callers from https:// pages must use the HTTPS listener —
# mixed-content rules block an https page from calling http://.
#
# Ports are unprivileged because nginx runs rootless (see nginx.conf).
#
# NOT 9001 for https: 9001-9006 are the six vLLM SFR-Embedding-Mistral replicas
# (ragstack embeds against 9001-9004). The whole 900x block is spoken for —
# hence 9443.

server {
    listen 9000 default_server;
    listen [::]:9000 default_server;
    server_name _;

    include /rag/config/proxy/snippets/routes.conf;
}

server {
    listen 9443 ssl default_server;
    listen [::]:9443 ssl default_server;
    http2 on;
    server_name _;

    # Self-signed placeholder generated by proxy.sh (tls/proxy.crt|key). Swap in
    # a real cert by replacing those two files and reloading — no route changes.
    # Until then, browsers will warn, and cross-origin XHR from ldkb.org will be
    # refused outright: a self-signed cert cannot be click-through-accepted on a
    # background request.
    ssl_certificate     /rag/config/proxy/tls/proxy.crt;
    ssl_certificate_key /rag/config/proxy/tls/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    include /rag/config/proxy/snippets/routes.conf;
}
