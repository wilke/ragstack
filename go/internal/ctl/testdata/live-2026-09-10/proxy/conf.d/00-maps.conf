# /rag/config/proxy/conf.d/00-maps.conf — the routing tables.
#
# THIS IS THE FILE YOU EDIT to add a tenant, point a route at a different port,
# or register a model endpoint. The server blocks in 10-gateway.conf are generic
# and read everything from here.

# ---------------------------------------------------------------------------
# Public mount: what the BV-BRC front proxy tells us about the real request
# ---------------------------------------------------------------------------
# https://www.bv-brc.org/ragstack/... reaches this gateway as plain http on
# :9000 with Host rewritten to coconut.cels.anl.gov:9000. Pass through whatever
# the front proxy declares about the ORIGINAL request, and fall back to our own
# view when nothing was declared, so direct on-campus access is unchanged.
# Used by snippets/proxy-common.conf.
map $http_x_forwarded_proto $forwarded_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default  $http_x_forwarded_host;
    ""       $host;
}

# ---------------------------------------------------------------------------
# CORS allowlist
# ---------------------------------------------------------------------------
# Browser origins permitted to call the API surface. An origin that is not
# listed maps to "" and then no Access-Control-Allow-Origin header is emitted,
# so the browser blocks the response (non-browser clients — curl, servers — are
# unaffected; CORS is enforced by the browser, not by us).
#
# NOTE the upstreams (ragstack, vLLM) already answer with a blanket
# `access-control-allow-origin: *`. The gateway strips that (proxy_hide_header
# in snippets/cors.conf) before adding the value below — otherwise the browser
# would see two Access-Control-Allow-Origin headers and reject the response
# outright, which is a confusing failure to debug.
map $http_origin $cors_origin {
    default                          "";
    "https://ldkb.org"               $http_origin;
    "https://www.ldkb.org"           $http_origin;
    "https://bv-brc.org"             $http_origin;
    "https://www.bv-brc.org"         $http_origin;
    "https://maage-brc.org"          $http_origin;
    "https://www.maage-brc.org"      $http_origin;
    # local development
    "http://localhost:5173"          $http_origin;
    "http://localhost:5175"          $http_origin;
    "http://localhost:8090"          $http_origin;
}

# ---------------------------------------------------------------------------
# Tenant -> ragstack API  (/ragstack/<tenant>/api/...)
# ---------------------------------------------------------------------------
# Each entry is a separately-launched `uvicorn ragstack.api.main:app` with its
# own env file — they do NOT share config, collections, or API keys.
#
#   lucid  :8010  /rag/config/lucid.env    — customer org, isolated qdrant2 (:6343), API keys required
#   asm    :8000  (inline env)             — ragstack_sfr_tok256, the long-running prod explorer
#   dev    :8020  /rag/config/unified.env  — unified explorer: collection picker + model registry
#   demo   :8030  /rag/config/demo.collections.json — demo corpora (andy, open-access)
#
# bvbrc is deliberately absent — add it here when its API server exists.
map $tenant $tenant_api {
    default  "";
    # DOWN as of 2026-08-25 — no process listens on either port, so these two
    # rows 502. Left in place rather than deleted: routing is correct the moment
    # the service is started again. They are deliberately NOT aliased to
    # lucid-next/asm-next, which are separate deployments; see the note below.
    lucid    "127.0.0.1:8010";
    asm      "127.0.0.1:8000";
    # Repointed to the dedicated dev tenant (own Qdrant :24041 + ES :24043,
    # own registry/ACL state). The former :8020 "unified explorer" shared
    # ASM's production Qdrant, ES index and manifest dir, so it listed ASM's
    # collections and could WRITE to them — outside the read-only guard that
    # protects the asm/lucid routes.
    dev      "127.0.0.1:24040";
    # demo moved to its tenant port block (index 3, base 24060) on 2026-08-12,
    # when it became a real tenant. The pre-tenant :8030 API is a second front
    # door on the same stores — stop it once this row is live.
    demo     "127.0.0.1:24060";
    # Parallel validation stacks (ADR-0003/0004/0005 access-control code). The
    # live lucid/asm rows above are deliberately unchanged — these are additive
    # so the running services keep serving while the new ones are validated.
    lucid-next "127.0.0.1:24000";
    asm-next   "127.0.0.1:24020";
}

# ---------------------------------------------------------------------------
# Tenant -> ragstack UI  (/ragstack/<tenant>/ui/...)
# ---------------------------------------------------------------------------
# These are Vite DEV servers, not built bundles.
#
# IMPORTANT: a Vite dev server emits ABSOLUTE asset paths (/@vite/client,
# /src/main.tsx, /node_modules/.vite/deps/*). Mounted under a path prefix it
# only works if it was started with a matching --base, so the gateway proxies
# these routes with the prefix PRESERVED (no rewrite) and Vite is responsible
# for it. Relaunch a dev server for path-mounting with:
#
#   cd ~/Development/ragstack/frontend
#   npx vite --host --port 8090 --base /ragstack/dev/ui/
#
# Until a server is relaunched that way, reach it directly on its own port
# (:5173, :5175, :8090) — the route below will serve index.html but its assets
# will 404 at the gateway root.
map $tenant $tenant_ui {
    default  "";
    lucid    "127.0.0.1:5175";   # ~/Development/ragstack/frontend
    asm      "127.0.0.1:5173";   # /rag/repos/ragstack/frontend (defaults to the :8000 API)
    dev      "127.0.0.1:8090";   # ~/Development/ragstack/frontend (backend switcher build)
    demo     "127.0.0.1:5210";   # base-aware instance (see README: vite --base)
    lucid-next "127.0.0.1:5211";   # base-aware, points at the :24000 API
    asm-next   "127.0.0.1:5212";   # base-aware, points at the :24020 API
}

# ---------------------------------------------------------------------------
# Services  (/ragstack/services/<name>)
# ---------------------------------------------------------------------------
# Stable, memorable URLs for things running on this host that are NOT fronted by
# this gateway. The route REDIRECTS to the address below; it does not proxy.
#
# Why a redirect and not a proxy, for each of them:
#
#   gowe     gowe-server still has no base-path option in v0.18.1 (checked
#            `--help`; the flag existed in no version between 0.13.2 and now).
#            It redirects / -> /login and serves /static/* as absolute root
#            paths, so under a path prefix its own links break. That is the same
#            reason it has its own listener at :8081/:8444 and why the /gowe/
#            gateway route was removed.
#
#   vaxpipe  Two reasons. Its Vite dev server runs with no `--base`, so mounted
#            under a prefix it would serve index.html and then 404 every asset
#            (same trap as the tenant UIs). More importantly, its dev proxy
#            INJECTS a live BV-BRC token (awilke@bvbrc) into /api/v1 and
#            /bvbrc/* whenever the caller sends none — see ui/vite.config.js.
#            Everything under /ragstack/ is reachable from the public internet
#            through the BV-BRC front proxy, and that proxy makes every public
#            client look like one campus IP here, so the gateway cannot let
#            campus in and keep the internet out. Proxying it would therefore
#            publish that token to anyone. A redirect exposes nothing: the
#            browser goes straight to the dev server, which is reachable only
#            from inside the network.
#
# The vaxpipe entry uses the IP deliberately: Vite's host check rejects
# coconut.cels.anl.gov with 403 ("This host is not allowed"). The IP, localhost
# and 127.0.0.1 pass. Switch it to the name once vite.config.js sets
# `server.allowedHosts`.
# Redirect targets for services this gateway does not proxy. Empty since the
# 2026-09-09 cutover: gowe was the last entry, and it is now a real proxied
# mount at /ragstack/services/gowe/ui, so /ragstack/services/gowe redirects
# there instead of out to the :8081 listener. Kept because the mechanism is
# still the right answer for a service that cannot be path-mounted.
map $service $service_target {
    default  "";
}

# Services that are PROXIED through the gateway rather than redirected to, i.e.
# mounted the same way a ragstack tenant UI is: the prefix is preserved and the
# app is told to expect it.
#
# vaxpipe qualifies as of 2026-09-09. Two things had to change first:
#   * its Vite dev server now runs with BASE_PATH=/ragstack/services/vaxpipe/
#     (ui/.env.local), so it emits asset URLs under the prefix instead of at the
#     root, and its own dev proxy keys are prefixed to match;
#   * GOWE_TOKEN was removed from ui/.env.local. That token was attached to
#     /api/v1 and /bvbrc/* for any caller that sent none, so publishing the app
#     would have published a live BV-BRC credential. Users now sign in and the
#     browser sends its own token.
# Do NOT add a service here until both of those are true of it.
#
# Since 2026-09-10 only the UI and its /bvbrc/* calls go to vaxpipe_ui; the
# /api/v1 calls are handed straight to gowe_backend by the allowlisted regex
# location in snippets/routes.conf, prefix stripped. The Vite hop was only ever
# there to inject the token, and it is an orphaned dev process that nothing
# restores after a reboot — it should not sit in the public API path.
# Allowlist for the GoWe API reachable through the PUBLIC vaxpipe mount.
# "ok" for the endpoints the Vaxpipe UI actually calls; everything else is
# refused at the gateway.
#
# WHY THIS EXISTS — GoWe's /api/v1/workers/* endpoints authenticate with
# X-Worker-Key, a SEPARATE model from the session auth that guards the rest of
# the API. With no --worker-keys on the server (production :8091 has none) that
# middleware is open. It went unnoticed because the obvious probe, GET
# /api/v1/workers, looks like a harmless public roster; the write side is the
# problem. Verified through the public URL: POST .../api/v1/workers/ with a
# deliberately malformed body answered 400 VALIDATION_ERROR, i.e. it passed auth
# and failed only on shape. Unrestricted, that let anyone on the internet
# register a worker, poll task checkout (receiving task inputs, and for
# bvbrc-executor tasks the submitter's embedded credential), post fake
# completions, or deregister the real fleet.
#
# An allowlist, not a deny rule on /workers: the same open-by-default middleware
# may cover endpoints not enumerated here, and a new GoWe release can add more.
# Default-deny fails safe, default-allow fails silently.
#
# GET /workers is allowed because the UI's fleet view calls it and it only
# reads. Every mutating worker call is refused.
#
# This is a GATEWAY guard and it protects only this route. :8091 and the
# :8081/:8444 listener still expose the open worker API to anything that can
# reach the host. The durable fix is --worker-keys on the server.
#
# EXIT CONDITION — do NOT remove this on keys alone. GET /api/v1/workers sits
# under the same worker-auth model, so enabling keys makes it demand
# X-Worker-Key, and the 401 that follows trips the Vaxpipe UI's global 401 bus
# and ejects a signed-in user from the app (components/ServerStatus.jsx). A
# gateway 403 only degrades the panel; a GoWe 401 breaks the session. GoWe#251
# adds a user-authenticated roster endpoint and is planned to ship in the same
# release as keys for exactly this reason. Remove this map once keys are live
# AND the UI reads the roster from that endpoint.
map "$request_method $vaxrest" $vaxpipe_api_allowed {
    default                                              "";
    "~^GET /health$"                                     "ok";
    # The user-authenticated roster (GoWe#251), the replacement for GET /workers
    # removed below. Added at the v0.19.0 cutover: without it the default deny
    # would 403 the endpoint the Vaxpipe panel is being migrated TO, so the
    # migration would look broken and the panel would stay degraded forever.
    "~^GET /fleet(/.*)?$"                                "ok";
    # GET /workers REMOVED 2026-09-09 at the v0.19.0 cutover. With --worker-keys
    # live on :8091 it returns 401, and the Vaxpipe app's 401 bus (api/client.js,
    # fires only on res.status === 401) signs the user out of the whole app. The
    # default deny answers 403 instead, which that bus never sees, so the fleet
    # panel degrades to a grey badge and the session survives.
    # Restore only once the panel reads GET /api/v1/fleet (user-authenticated,
    # unaffected by worker keys) — as of the cutover it had not migrated.
    "~^(GET|POST|PUT|PATCH|DELETE) /submissions(/.*)?$"  "ok";
    "~^(GET|POST|PUT|PATCH|DELETE) /workflows(/.*)?$"    "ok";
    "~^GET /files(/.*)?$"                                "ok";
    # Upload of a local structure / FASTA (multipart POST; the UI's
    # StructureInput and SequenceInput). Session-authenticated on GoWe like
    # /submissions — anonymous callers get GoWe's 401. Added 2026-09-10: until
    # then local-file inputs through the public URL were refused here with 403
    # while workspace-path inputs worked, and nothing said why.
    "~^POST /files/?$"                                   "ok";
}

upstream vaxpipe_ui {
    server 127.0.0.1:5174;
}

# ---------------------------------------------------------------------------
# Read-only tenants  (gateway-level guard, NOT authorization)
# ---------------------------------------------------------------------------
# While asm/lucid are being migrated, stop the gateway forwarding API calls that
# MUTATE them. Deliberately PATH-based, not method-based: /v1/query and
# /v1/retrieve are POSTs that only read, so blocking POST wholesale would take
# both services down.
#
# SCOPE — what this does NOT do, so it cannot be mistaken for immutability:
#   * the API ports bind 0.0.0.0, so anything that can reach the host writes
#     directly and never sees this rule;
#   * the bulk CLI (scripts/ingest_jsonl.py) writes straight to Qdrant/ES and
#     never touches the API at all.
# It stops an accidental write through the gateway — a stray curl, a UI button,
# a misconfigured client. That is its whole claim.
map $tenant $tenant_readonly {
    default  "";
    lucid    "ro";
    asm      "ro";
}

# "w" iff the method+path pair mutates. GET/HEAD/OPTIONS never match, and the
# two read POSTs are absent by construction rather than by exception.
map "$request_method $rest" $ragstack_write {
    default                                     "";
    "~^(POST|PUT|PATCH|DELETE) v1/ingest"       "w";
    "~^(POST|PUT|PATCH|DELETE) v1/collections"  "w";
    "~^(PUT|PATCH|DELETE) v1/documents"         "w";
    "~^(POST|PUT|PATCH|DELETE) v1/admin"        "w";
    "~^(POST|PUT|PATCH|DELETE) v1/jobs"         "w";
    "~^POST v1/stats/models/benchmark"          "w";
}

# ---------------------------------------------------------------------------
# Model endpoints — REMOVED 2026-08-25
# ---------------------------------------------------------------------------
# The /models/... routes came out of snippets/routes.conf when this gateway
# became the BV-BRC /ragstack mount, and the four maps that served them
# ($mhost_canonical, $model_allowed, $model_target and the alias table) had to
# come out with them. They could NOT simply be left in place as dead config:
# each keyed on a variable that only existed as a named capture inside those
# locations, so with the locations gone nginx refuses to start at all —
# `[emerg] unknown "mhost" variable`.
#
# The host:port -> model table still exists in two places if the routes are ever
# wanted back: html/models.json, and the pre-removal configs
# conf.d/00-maps.conf.bak-bvbrc-mount-20260825-162855 and
# snippets/routes.conf.bak-bvbrc-mount-20260825-162855.
#
# Note the allowlist those maps enforced was the thing that kept
# /models/<host>/<port>/ from being an open proxy into the internal network. If
# the routes are restored, restore the allowlist WITH them.

# WebSocket upgrade passthrough (Vite HMR, GoWe live updates). "" for a normal
# request so the Connection header is closed rather than dangling as "upgrade".
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

# Worker-endpoint guard for the GoWe listener (:8081 / :8444) — stopgap.
# ""  = forward,  "denied" = refuse at the gateway.
#
# Same root cause as $vaxpipe_api_allowed: /api/v1/workers/* authenticates with
# X-Worker-Key, and with no --worker-keys on :8091 that middleware is open, so
# anything able to reach this listener could register a worker, poll task
# checkout, post fake completions, or deregister the fleet.
#
# DELIBERATELY A DENY RULE, not an allowlist like the vaxpipe route. There the
# only consumer is one UI whose calls are known, so default-deny costs nothing.
# Here the consumer is GoWe's OWN web UI — a full admin interface whose surface
# this proxy does not control and would break under an allowlist derived from a
# different app. So this narrows to exactly the auth model that is open and
# leaves the session-gated remainder alone.
#
# GET of the roster is still forwarded: it only reads, and it is what a fleet
# view calls. Every worker sub-path and every mutating method is refused.
#
# $gwrest is "" for /api/v1/workers, "/" with a trailing slash, and "/<id>/..."
# for the sub-resources that do checkout, heartbeat and completions.
#
# The real fleet is unaffected either way: all 21 workers connect straight to
# localhost:8091 and never traverse this listener.
#
# REMOVE once --worker-keys is live on :8091 — at that point GoWe enforces this
# itself and this rule only obscures where the answer comes from. The roster
# caveat on $vaxpipe_api_allowed does not apply here: nothing this proxy serves
# on :8081 consumes the roster, so keys alone are a sufficient exit condition.
map "$request_method $gwrest" $gowe_worker_denied {
    default   "denied";
    "GET "    "";
    "GET /"   "";
}

# GoWe is a single fixed backend, so it gets a real upstream block (keepalive,
# no per-request DNS) rather than a map.
upstream gowe_backend {
    server 127.0.0.1:8091;
    keepalive 16;
}
