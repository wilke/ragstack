# /rag/config/proxy/nginx.conf — coconut front proxy (rootless).
#
# Runs as the invoking user inside an Apptainer container (nginx.sif), so every
# path nginx writes to must live under /rag/config/proxy/run/ — the container
# filesystem is read-only and there is no root to own /var/run or /var/cache.
# For the same reason the `user` directive is omitted (it is meaningful only for
# a root master process) and no listener may use a privileged port: see
# conf.d/10-gateway.conf (9000/9443) and conf.d/20-gowe.conf (8081/8444).
#
# Start/stop/reload with ./proxy.sh — it wires the bind mounts and the -c flag.

# Fixed, not `auto`: coconut has 64+ cores, and `auto` spawned a worker per core
# for what is a low-volume front proxy — 64 processes competing for the same
# sockets alongside vLLM and the databases. 4 is ample here.
worker_processes  4;
pid               /rag/config/proxy/run/nginx.pid;
error_log         /rag/config/proxy/run/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All scratch paths under run/ — see header note about the read-only container.
    client_body_temp_path /rag/config/proxy/run/tmp/client_body;
    proxy_temp_path       /rag/config/proxy/run/tmp/proxy;
    fastcgi_temp_path     /rag/config/proxy/run/tmp/fastcgi;
    uwsgi_temp_path       /rag/config/proxy/run/tmp/uwsgi;
    scgi_temp_path        /rag/config/proxy/run/tmp/scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" -> "$upstream_addr"';
    access_log  /rag/config/proxy/run/logs/access.log main;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Model answers stream and RAG queries are slow — do not cut them off at the
    # 60s default. Ingest uploads can be large, so the body limit is generous.
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;
    client_max_body_size  512m;

    # Runtime DNS. Upstreams are selected through variables (see the maps in
    # conf.d/00-maps.conf), and nginx resolves a variable upstream at REQUEST
    # time, not at startup — without a resolver those proxy_pass lines fail to
    # load. 127.0.0.53 is the host's systemd-resolved stub; the container shares
    # the host network namespace, so it is reachable from inside.
    resolver       127.0.0.53 ipv6=off valid=300s;
    resolver_timeout 5s;

    include /rag/config/proxy/conf.d/*.conf;
}
