# Example inputs for ingest-bulk.cwl.
shards:
  - {class: File, path: /rag/cache/load12/shards/tok256/example.s0.jsonl}
  - {class: File, path: /rag/cache/load12/shards/tok256/example.s1.jsonl}
collection: ragstack_sfr_tok256
tenant: public
chunk_method: fixed_token
chunk_size: 256
chunk_overlap: 32
embedding_model: Salesforce/SFR-Embedding-Mistral
embedding_url:
  - http://localhost:9001
  - http://localhost:9002
# Bearer token for keyed endpoints (e.g. lambda13); drop for keyless.
embedding_api_key: CHANGE-ME-EMBED-API-KEY
# Store targets are REQUIRED and have no defaults (#407/#454): a run that omits
# them is refused at submission rather than falling back to localhost:6333/:9200,
# which on the deployment host are the PRODUCTION instances.
qdrant_url: http://CHANGE-ME-QDRANT:6333
es_url: http://CHANGE-ME-ES:9200
# #849: the chunk cap is the submitter's decision; 0 = none (the registry
# entry's explicit max_chunks override still applies).
# max_chunks: 0
# #847 G2b: the glossary step. "off" (the default) = rules only, offline. With
# "on" give the endpoint, the model and every limit (the tool refuses 0 with
# "on"); the key travels by NAME — the worker's --secret-file sets it.
# glossary_llm: "off"
# glossary_llm_endpoint: http://CHANGE-ME-MODEL:8000
# glossary_llm_model: CHANGE-ME
# glossary_llm_api_key_env: OPENAI_API_KEY
# glossary_llm_concurrency: 16
# glossary_llm_timeout_s: 300.0
# glossary_llm_max_tokens: 4096
# glossary_llm_window_chars: 80000
# glossary_llm_max_windows: 4
# glossary_llm_thinking: "off"
# glossary_llm_repair_rounds: 0
# glossary_llm_cutoff_retry: split
