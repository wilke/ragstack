# Example inputs for load-embeddings.cwl (the load half — upserts to Qdrant/ES).
# The embedding files are the `embeddings` output of embed-bulk.cwl.
embeddings:
  - {class: File, path: /rag/cache/load12/embeddings/tok256/example.s0.emb.jsonl}
  - {class: File, path: /rag/cache/load12/embeddings/tok256/example.s1.emb.jsonl}
collection: ragstack_sfr_tok256
es_index: ragstack_sfr_tok256
tenant: public
# Store targets: PLACEHOLDERS on purpose (#407). Replace with the instances you
# intend to WRITE to, and check them twice — a hand-run with a real address here
# writes into whatever it names. The defaults these replaced pointed at the
# deployment host's PRODUCTION Qdrant/Elasticsearch.
qdrant_url: http://CHANGE-ME-QDRANT:6333
es_url: http://CHANGE-ME-ES:9200
fail_on_error: true
# Upsert backpressure (#141) is OFF by default — the capped-Qdrant A/B benchmark
# found it adds latency without preventing drops below crash-scale. Set true for a
# very large corpus on a capped Qdrant.
backpressure: false
