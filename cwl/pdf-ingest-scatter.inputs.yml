# Example inputs for cwl/pdf-ingest-scatter.cwl (one task chain + one receipt per
# BATCH of batch_size PDFs; a row per document inside). The store targets below are
# PLACEHOLDERS you must replace (#407); use a demo_*-prefixed throwaway collection
# on a NON-production instance for smoke tests.
#
#   CWL_SINGULARITY_CACHE=apptainer/images \
#   APPTAINER_BIND=/rag/cache HF_HOME=/rag/cache \
#     cwltool --singularity cwl/pdf-ingest-scatter.cwl cwl/pdf-ingest-scatter.inputs.yml
pdfs:
  - {class: File, path: /rag/data/g1-corpus/pdfs/PMC10100743.pdf}
  - {class: File, path: /rag/data/g1-corpus/pdfs/PMC10100882.pdf}
  - {class: File, path: /rag/data/g1-corpus/pdfs/PMC10105658.pdf}
# PDFs per task (default 20); 1 = one task per PDF (Option A).
batch_size: 2
collection: demo_gowe_pdf_scatter
tenant: public
chunk_method: fixed_token
chunk_size: 256
chunk_overlap: 32
embedding_url:
  - http://localhost:9001
  - http://localhost:9002
  - http://localhost:9003
  - http://localhost:9004
embedding_model: Salesforce/SFR-Embedding-Mistral
# Store targets: PLACEHOLDERS on purpose (#407). Replace with the instances you
# intend to WRITE to, and check them twice — a hand-run with a real address here
# writes into whatever it names. The defaults these replaced pointed at the
# deployment host's PRODUCTION Qdrant/Elasticsearch.
qdrant_url: http://CHANGE-ME-QDRANT:6333
es_url: http://CHANGE-ME-ES:9200
# Archive (#357): the run's version directory lands at <outdir>/<version>/.
version: "1"
collection_id: demo_gowe_pdf_scatter
