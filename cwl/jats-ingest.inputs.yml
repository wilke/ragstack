# Example inputs for jats-ingest.cwl — DEV TENANT prototype (#301).
#
# Prerequisites, in order:
#   1. The collection exists in the tenant's registry (POST /v1/collections).
#      'oa-dev' was created on the dev tenant with fixed_token 512/64 — its
#      physical store names are SERVER-MINTED (ragstack_lib_oa_dev_..._e788c5be);
#      nothing in this file names a store.
#   2. plan_shards.py has produced shard files from the harvest.
#
# The registry db is the dev tenant's sqlite collection store, read-only here.

corpus:
  class: Directory
  location: /rag/oa/corpus

# Shard files from plan_shards.py. These are the dev-proto test shards, which
# exist on this host; a real round's shards live wherever --out pointed.
shards:
  - class: File
    location: /rag/ingest/oa/dev-proto/shards/shard-00000.jsonl
  - class: File
    location: /rag/ingest/oa/dev-proto/shards/shard-00001.jsonl

collection_id: oa-dev

registry_db:
  class: File
  location: /rag/data/tenants/dev/state/ragstack_collections.db

tenant: public

chunk_method: fixed_token
chunk_size: 512
chunk_overlap: 64

embedding_url:
  - http://localhost:9001
  - http://localhost:9002
embedding_model: Salesforce/SFR-Embedding-Mistral

# Store targets: PLACEHOLDERS on purpose (#407). Replace with the instances you
# intend to WRITE to, and check them twice — a hand-run with a real address here
# writes into whatever it names. The defaults these replaced pointed at the
# deployment host's PRODUCTION Qdrant/Elasticsearch.
# (These previously named the dev tenant's LIVE stores, :24041/:24043.)
qdrant_url: http://CHANGE-ME-QDRANT:6333
es_url: http://CHANGE-ME-ES:9200

backpressure: false
# #849: the chunk cap is the submitter's decision; 0 = none (the registry
# entry's explicit max_chunks override still applies).
# max_chunks: 0
# #847 G2b: the glossary step. "off" (the default) = rules only, offline. With
# "on" give the endpoint, the model and every limit (the tool refuses 0 with
# "on"); the key travels by NAME — the worker's --secret-file sets it.
# glossary_llm: "off"
# glossary_llm_endpoint: http://CHANGE-ME-MODEL:8000
# glossary_llm_model: CHANGE-ME
# glossary_llm_api_key_env: OPENAI_API_KEY
# glossary_llm_concurrency: 16
# glossary_llm_timeout_s: 300.0
# glossary_llm_max_tokens: 4096
# glossary_llm_window_chars: 80000
# glossary_llm_max_windows: 4
# glossary_llm_thinking: "off"
# glossary_llm_repair_rounds: 0
# glossary_llm_cutoff_retry: split
# JATS table/figure units are documents: keep them off the model.
# glossary_llm_min_chars: 1500
